<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 536" width="640" height="536" role="img" aria-labelledby="t d"><title id="t">Render to iRacing</title><desc id="d">Five stacked steps: press Render, two TGA files are written, they are copied to the iRacing paint folder, Alt+Tab to iRacing, press Ctrl+R.</desc><rect width="640" height="536" fill="#0b0e17"/><text x="16.0" y="30.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="20" fill="#eef2f9" text-anchor="start" font-weight="700" >From Render to iRacing in five steps</text><rect x="14.0" y="44.0" width="612.0" height="82.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="14.0" y="52.0" width="4.0" height="66.0" rx="2" fill="#f5761a" /><circle cx="46.0" cy="85.0" r="17" fill="#f5761a" /><text x="46.0" y="92.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="18" fill="#0b0e17" text-anchor="middle" font-weight="700" >1</text><text x="78.0" y="74.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="16" fill="#eef2f9" text-anchor="start" font-weight="700" >Press RENDER in Shokker</text><text x="78.0" y="96.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#8794ad" text-anchor="start" >Needs your iRacing User ID and your car chosen in iRacing Car Folder.</text><line x1="46.0" y1="127.0" x2="46.0" y2="141.0" stroke="#f5761a" stroke-width="2.5" /><polygon points="46.0,141.0 42.1,132.9 49.9,132.9" fill="#f5761a"/><rect x="14.0" y="142.0" width="612.0" height="82.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="14.0" y="150.0" width="4.0" height="66.0" rx="2" fill="#f5761a" /><circle cx="46.0" cy="183.0" r="17" fill="#f5761a" /><text x="46.0" y="190.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="18" fill="#0b0e17" text-anchor="middle" font-weight="700" >2</text><text x="78.0" y="172.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="16" fill="#eef2f9" text-anchor="start" font-weight="700" >Two files are written</text><text x="78.0" y="194.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#8794ad" text-anchor="start" >car_num_&lt;ID&gt;.tga (or car_&lt;ID&gt;.tga) is the paint. car_spec_&lt;ID&gt;.tga is the</text><text x="78.0" y="213.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#8794ad" text-anchor="start" >shine.</text><line x1="46.0" y1="225.0" x2="46.0" y2="239.0" stroke="#f5761a" stroke-width="2.5" /><polygon points="46.0,239.0 42.1,230.9 49.9,230.9" fill="#f5761a"/><rect x="14.0" y="240.0" width="612.0" height="82.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="14.0" y="248.0" width="4.0" height="66.0" rx="2" fill="#f5761a" /><circle cx="46.0" cy="281.0" r="17" fill="#f5761a" /><text x="46.0" y="288.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="18" fill="#0b0e17" text-anchor="middle" font-weight="700" >3</text><text x="78.0" y="270.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="16" fill="#eef2f9" text-anchor="start" font-weight="700" >They are copied into your iRacing paint folder</text><text x="78.0" y="292.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#8794ad" text-anchor="start" >Documents\iRacing\paint\&lt;car folder&gt;\ If no car folder is set, nothing</text><text x="78.0" y="311.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#8794ad" text-anchor="start" >reaches iRacing.</text><line x1="46.0" y1="323.0" x2="46.0" y2="337.0" stroke="#f5761a" stroke-width="2.5" /><polygon points="46.0,337.0 42.1,328.9 49.9,328.9" fill="#f5761a"/><rect x="14.0" y="338.0" width="612.0" height="82.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="14.0" y="346.0" width="4.0" height="66.0" rx="2" fill="#f5761a" /><circle cx="46.0" cy="379.0" r="17" fill="#f5761a" /><text x="46.0" y="386.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="18" fill="#0b0e17" text-anchor="middle" font-weight="700" >4</text><text x="78.0" y="368.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="16" fill="#eef2f9" text-anchor="start" font-weight="700" >Alt+Tab to iRacing</text><text x="78.0" y="390.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#8794ad" text-anchor="start" >Be in a session with your car. In a replay, pick a moment when you are not</text><text x="78.0" y="409.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#8794ad" text-anchor="start" >in the pits.</text><line x1="46.0" y1="421.0" x2="46.0" y2="435.0" stroke="#f5761a" stroke-width="2.5" /><polygon points="46.0,435.0 42.1,426.9 49.9,426.9" fill="#f5761a"/><rect x="14.0" y="436.0" width="612.0" height="82.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="14.0" y="444.0" width="4.0" height="66.0" rx="2" fill="#f5761a" /><circle cx="46.0" cy="477.0" r="17" fill="#f5761a" /><text x="46.0" y="484.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="18" fill="#0b0e17" text-anchor="middle" font-weight="700" >5</text><text x="78.0" y="466.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="16" fill="#eef2f9" text-anchor="start" font-weight="700" >Press Ctrl+R (Reload Car Textures)</text><text x="78.0" y="488.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#8794ad" text-anchor="start" >The car flashes white and shows the new paint. No restart needed.</text></svg>
