<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 585" width="640" height="585" role="img" aria-labelledby="t d"><title id="t">Zone colour modes</title><desc id="d">Five rows with small colour tiles: finish's own colour, source paint, solid colour, from special, custom gradient, each with a one-line meaning.</desc><defs><linearGradient id="gf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2d8f9b"/><stop offset="1" stop-color="#a0e6d0"/></linearGradient><linearGradient id="gs" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffffff"/></linearGradient><linearGradient id="gp" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b07cff"/><stop offset="1" stop-color="#ffaa00"/></linearGradient><linearGradient id="gg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff3366"/><stop offset="0.5" stop-color="#ffaa00"/><stop offset="1" stop-color="#33ff66"/></linearGradient></defs><rect width="640" height="585" fill="#0b0e17"/><text x="16.0" y="30.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="20" fill="#eef2f9" text-anchor="start" font-weight="700" >Where a zone's colour comes from</text><text x="16.0" y="52.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#8794ad" text-anchor="start" >The BASE COLOR dropdown in a zone. Five choices.</text><rect x="14.0" y="77.3" width="612.0" height="76.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="14.0" y="85.3" width="4.0" height="60.0" rx="2" fill="#f5761a" /><rect x="30.0" y="89.3" width="96.0" height="52.0" rx="6" fill="url(#gf)" stroke="#2a3150" stroke-width="1" /><text x="142.0" y="107.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="16" fill="#eef2f9" text-anchor="start" font-weight="700" >Use finish's own color</text><text x="142.0" y="129.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13.5" fill="#c3ccdd" text-anchor="start" >The material keeps its own colour. New zones start here.</text><rect x="14.0" y="161.3" width="612.0" height="76.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="14.0" y="169.3" width="4.0" height="60.0" rx="2" fill="#f5761a" /><rect x="30.0" y="173.3" width="96.0" height="52.0" rx="6" fill="#1f3b8f" stroke="#2a3150" stroke-width="1" /><rect x="30.0" y="189.3" width="96.0" height="8.0" rx="0" fill="#e8e8ee" /><rect x="30.0" y="205.3" width="96.0" height="8.0" rx="0" fill="#d62d20" /><rect x="30.0" y="173.3" width="96.0" height="52.0" rx="6" fill="#ffffff" opacity="0.10"/><text x="142.0" y="191.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="16" fill="#eef2f9" text-anchor="start" font-weight="700" >Use source paint (spec only)</text><text x="142.0" y="213.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13.5" fill="#c3ccdd" text-anchor="start" >Keeps your car's existing paint. Only the shine and texture change.</text><rect x="14.0" y="245.3" width="612.0" height="76.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="14.0" y="253.3" width="4.0" height="60.0" rx="2" fill="#f5761a" /><rect x="30.0" y="257.3" width="96.0" height="52.0" rx="6" fill="#d62d20" stroke="#2a3150" stroke-width="1" /><text x="142.0" y="275.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="16" fill="#eef2f9" text-anchor="start" font-weight="700" >Use solid color</text><text x="142.0" y="297.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13.5" fill="#c3ccdd" text-anchor="start" >One exact colour you choose, with the finish's shine on top.</text><rect x="14.0" y="329.3" width="612.0" height="76.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="14.0" y="337.3" width="4.0" height="60.0" rx="2" fill="#f5761a" /><rect x="30.0" y="341.3" width="96.0" height="52.0" rx="6" fill="url(#gp)" stroke="#2a3150" stroke-width="1" /><circle cx="44.0" cy="363.3" r="3" fill="#ffffff" opacity="0.7"/><circle cx="61.0" cy="371.3" r="3" fill="#ffffff" opacity="0.7"/><circle cx="78.0" cy="363.3" r="3" fill="#ffffff" opacity="0.7"/><circle cx="95.0" cy="371.3" r="3" fill="#ffffff" opacity="0.7"/><circle cx="112.0" cy="363.3" r="3" fill="#ffffff" opacity="0.7"/><text x="142.0" y="359.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="16" fill="#eef2f9" text-anchor="start" font-weight="700" >From special</text><text x="142.0" y="381.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13.5" fill="#c3ccdd" text-anchor="start" >Takes its colours from another special finish.</text><rect x="14.0" y="413.3" width="612.0" height="76.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="14.0" y="421.3" width="4.0" height="60.0" rx="2" fill="#f5761a" /><rect x="30.0" y="425.3" width="96.0" height="52.0" rx="6" fill="url(#gg)" stroke="#2a3150" stroke-width="1" /><text x="142.0" y="443.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="16" fill="#eef2f9" text-anchor="start" font-weight="700" >Custom gradient</text><text x="142.0" y="465.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13.5" fill="#c3ccdd" text-anchor="start" >2 to 10 colour stops fading across the zone in a direction you set.</text><rect x="14.0" y="501.3" width="612.0" height="66.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="14.0" y="509.3" width="4.0" height="50.0" rx="2" fill="#4cc38a" /><text x="32.0" y="529.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#c3ccdd" text-anchor="start" >Want to keep your livery and only change the shine? Choose Use source paint (spec</text><text x="32.0" y="548.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#c3ccdd" text-anchor="start" >only).</text></svg>
