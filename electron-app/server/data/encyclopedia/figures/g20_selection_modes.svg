<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 511" width="640" height="511" role="img" aria-labelledby="t d"><title id="t">Add, Replace and Subtract</title><desc id="d">Three cards each with a before and after picture of two overlapping circles. Add shows both, Replace shows only the new, Subtract shows the old with the new cut out.</desc><defs><mask id="m3"><rect x="0" y="0" width="640" height="2000" fill="white"/><g fill="black"><circle cx="536" cy="289.32" r="28"/></g></mask></defs><rect width="640" height="511" fill="#0b0e17"/><text x="16.0" y="30.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="20" fill="#eef2f9" text-anchor="start" font-weight="700" >Selection modes: Add, Replace, Subtract</text><text x="16.0" y="52.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#8794ad" text-anchor="start" >How a new selection combines with the one you already have.</text><rect x="12.0" y="77.3" width="196.0" height="330.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="12.0" y="85.3" width="4.0" height="314.0" rx="2" fill="#f5761a" /><text x="30.0" y="107.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="18" fill="#eef2f9" text-anchor="start" font-weight="700" >Add</text><text x="30.0" y="135.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="start" font-weight="700" >Before</text><rect x="30.0" y="143.3" width="160.0" height="76.0" rx="6" fill="#080a12" stroke="#2a3150" stroke-width="1" /><circle cx="84.0" cy="181.3" r="28" fill="#00e5ff" opacity="0.85"/><circle cx="116.0" cy="181.3" r="28" fill="none" stroke="#f5761a" stroke-width="2.5" stroke-dasharray="5 4"/><text x="66.0" y="185.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#0b0e17" text-anchor="middle" font-weight="700" >old</text><text x="142.0" y="185.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#f5761a" text-anchor="middle" font-weight="700" >new</text><text x="30.0" y="243.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="start" font-weight="700" >After</text><rect x="30.0" y="251.3" width="160.0" height="76.0" rx="6" fill="#080a12" stroke="#2a3150" stroke-width="1" /><g fill="#4cc38a" opacity="0.9"><circle cx="84" cy="289.32" r="28"/><circle cx="116" cy="289.32" r="28"/></g><text x="30.0" y="351.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#c3ccdd" text-anchor="start" >Keeps the old and adds</text><text x="30.0" y="369.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#c3ccdd" text-anchor="start" >the new. Shift + click</text><text x="30.0" y="387.2" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#c3ccdd" text-anchor="start" >with the Wand.</text><rect x="222.0" y="77.3" width="196.0" height="330.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="222.0" y="85.3" width="4.0" height="314.0" rx="2" fill="#f5761a" /><text x="240.0" y="107.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="18" fill="#eef2f9" text-anchor="start" font-weight="700" >Replace</text><text x="240.0" y="135.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="start" font-weight="700" >Before</text><rect x="240.0" y="143.3" width="160.0" height="76.0" rx="6" fill="#080a12" stroke="#2a3150" stroke-width="1" /><circle cx="294.0" cy="181.3" r="28" fill="#00e5ff" opacity="0.85"/><circle cx="326.0" cy="181.3" r="28" fill="none" stroke="#f5761a" stroke-width="2.5" stroke-dasharray="5 4"/><text x="276.0" y="185.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#0b0e17" text-anchor="middle" font-weight="700" >old</text><text x="352.0" y="185.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#f5761a" text-anchor="middle" font-weight="700" >new</text><text x="240.0" y="243.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="start" font-weight="700" >After</text><rect x="240.0" y="251.3" width="160.0" height="76.0" rx="6" fill="#080a12" stroke="#2a3150" stroke-width="1" /><g fill="#4cc38a" opacity="0.9"><circle cx="326" cy="289.32" r="28"/></g><text x="240.0" y="351.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#c3ccdd" text-anchor="start" >Throws the old away.</text><text x="240.0" y="369.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#c3ccdd" text-anchor="start" >Only the new selection</text><text x="240.0" y="387.2" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#c3ccdd" text-anchor="start" >is left.</text><rect x="432.0" y="77.3" width="196.0" height="330.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="432.0" y="85.3" width="4.0" height="314.0" rx="2" fill="#f5761a" /><text x="450.0" y="107.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="18" fill="#eef2f9" text-anchor="start" font-weight="700" >Subtract</text><text x="450.0" y="135.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="start" font-weight="700" >Before</text><rect x="450.0" y="143.3" width="160.0" height="76.0" rx="6" fill="#080a12" stroke="#2a3150" stroke-width="1" /><circle cx="504.0" cy="181.3" r="28" fill="#00e5ff" opacity="0.85"/><circle cx="536.0" cy="181.3" r="28" fill="none" stroke="#f5761a" stroke-width="2.5" stroke-dasharray="5 4"/><text x="486.0" y="185.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#0b0e17" text-anchor="middle" font-weight="700" >old</text><text x="562.0" y="185.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#f5761a" text-anchor="middle" font-weight="700" >new</text><text x="450.0" y="243.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="start" font-weight="700" >After</text><rect x="450.0" y="251.3" width="160.0" height="76.0" rx="6" fill="#080a12" stroke="#2a3150" stroke-width="1" /><g mask="url(#m3)" fill="#4cc38a" opacity="0.9"><circle cx="504" cy="289.32" r="28"/></g><text x="450.0" y="351.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#c3ccdd" text-anchor="start" >Cuts the new one out of</text><text x="450.0" y="369.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#c3ccdd" text-anchor="start" >the old. Alt + click</text><text x="450.0" y="387.2" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#c3ccdd" text-anchor="start" >with the Wand.</text><rect x="14.0" y="423.3" width="612.0" height="70.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="14.0" y="431.3" width="4.0" height="54.0" rx="2" fill="#8794ad" /><text x="32.0" y="451.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#c3ccdd" text-anchor="start" >Pick the mode in the Selection mode dropdown. Tolerance sets how similar a colour</text><text x="32.0" y="470.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#c3ccdd" text-anchor="start" >must be to be picked.</text></svg>
