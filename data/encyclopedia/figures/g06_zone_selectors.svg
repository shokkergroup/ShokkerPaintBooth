<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 620" width="640" height="620" role="img" aria-labelledby="t d"><title id="t">How a zone picks pixels</title><desc id="d">Four rows with small pictures: by colour with colour chips, by layer with stacked layers, by drawn area with a dashed box, and everything else as the catch-all, plus a note about named parts.</desc><rect width="640" height="620" fill="#0b0e17"/><text x="16.0" y="30.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="20" fill="#eef2f9" text-anchor="start" font-weight="700" >Four ways a zone picks its pixels</text><text x="16.0" y="52.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#8794ad" text-anchor="start" >A zone only paints what it selects. Mix them: colour or layer first, then limit by</text><text x="16.0" y="71.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#8794ad" text-anchor="start" >area.</text><rect x="14.0" y="96.6" width="612.0" height="98.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="14.0" y="104.6" width="4.0" height="82.0" rx="2" fill="#f5761a" /><rect x="30.0" y="114.6" width="92.0" height="62.0" rx="6" fill="#080a12" stroke="#2a3150" stroke-width="1" /><circle cx="52.0" cy="145.6" r="10" fill="#d62d20" stroke="#eef2f9" stroke-width="2" /><circle cx="76.0" cy="145.6" r="10" fill="#e8e8ee" /><circle cx="100.0" cy="145.6" r="10" fill="#1b6fd1" /><text x="138.0" y="124.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="18" fill="#eef2f9" text-anchor="start" font-weight="700" >By colour</text><text x="244.3" y="124.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#f5761a" text-anchor="start" font-weight="700" >PICK COLOR FROM CAR</text><text x="138.0" y="148.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#c3ccdd" text-anchor="start" >Click a colour on the car and the zone takes every pixel of it.</text><text x="138.0" y="168.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#c3ccdd" text-anchor="start" >Tolerance: 6 = that exact shade, 30 to 50 = normal, 100 = loose.</text><rect x="14.0" y="204.6" width="612.0" height="98.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="14.0" y="212.6" width="4.0" height="82.0" rx="2" fill="#00e5ff" /><rect x="30.0" y="222.6" width="92.0" height="62.0" rx="6" fill="#080a12" stroke="#2a3150" stroke-width="1" /><rect x="42.0" y="232.6" width="58.0" height="22.0" rx="3" fill="#00e5ff" stroke="#0b0e17" stroke-width="1.5" opacity="0.95"/><rect x="48.0" y="246.6" width="58.0" height="22.0" rx="3" fill="#5b667e" stroke="#0b0e17" stroke-width="1.5" opacity="0.95"/><rect x="54.0" y="260.6" width="58.0" height="22.0" rx="3" fill="#3a4260" stroke="#0b0e17" stroke-width="1.5" opacity="0.95"/><text x="138.0" y="232.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="18" fill="#eef2f9" text-anchor="start" font-weight="700" >By layer</text><text x="234.1" y="232.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#00e5ff" text-anchor="start" font-weight="700" >RESTRICT TO LAYERS</text><text x="138.0" y="256.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#c3ccdd" text-anchor="start" >Tick layers such as Car Paint, Sponsors or Numbers. The zone only</text><text x="138.0" y="276.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#c3ccdd" text-anchor="start" >covers pixels that exist on those layers.</text><rect x="14.0" y="312.6" width="612.0" height="98.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="14.0" y="320.6" width="4.0" height="82.0" rx="2" fill="#ff3366" /><rect x="30.0" y="330.6" width="92.0" height="62.0" rx="6" fill="#080a12" stroke="#2a3150" stroke-width="1" /><rect x="42.0" y="340.6" width="68.0" height="42.0" rx="0" fill="none" stroke="#ff3366" stroke-width="2" stroke-dasharray="5 4"/><rect x="52.0" y="350.6" width="30.0" height="22.0" rx="0" fill="#ff3366" opacity="0.6"/><text x="138.0" y="340.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="18" fill="#eef2f9" text-anchor="start" font-weight="700" >By drawn area</text><text x="285.4" y="340.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#ff3366" text-anchor="start" font-weight="700" >APPLY AREA: Draw box / Lasso</text><text x="138.0" y="364.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#c3ccdd" text-anchor="start" >Draw a rectangle or a free-hand shape. The zone only affects what</text><text x="138.0" y="384.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#c3ccdd" text-anchor="start" >is inside it.</text><rect x="14.0" y="420.6" width="612.0" height="98.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="14.0" y="428.6" width="4.0" height="82.0" rx="2" fill="#8794ad" /><rect x="30.0" y="438.6" width="92.0" height="62.0" rx="6" fill="#080a12" stroke="#2a3150" stroke-width="1" /><rect x="36.0" y="444.6" width="80.0" height="50.0" rx="4" fill="#8794ad" opacity="0.35"/><rect x="36.0" y="444.6" width="28.0" height="50.0" rx="4" fill="#f5761a" /><rect x="64.0" y="444.6" width="22.0" height="24.0" rx="0" fill="#00e5ff" /><text x="138.0" y="448.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="18" fill="#eef2f9" text-anchor="start" font-weight="700" >Everything else</text><text x="305.9" y="448.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="start" font-weight="700" >Remaining</text><text x="138.0" y="472.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#c3ccdd" text-anchor="start" >The catch-all: gets every pixel no zone above it claims.</text><rect x="14.0" y="528.6" width="612.0" height="74.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="14.0" y="536.6" width="4.0" height="58.0" rx="2" fill="#4cc38a" /><text x="32.0" y="556.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="15" fill="#eef2f9" text-anchor="start" font-weight="700" >Chat and the AI copilot add a fifth way</text><text x="32.0" y="578.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#c3ccdd" text-anchor="start" >Name a part of the car: left side, right side, hood, roof, trunk or a bumper.</text></svg>
