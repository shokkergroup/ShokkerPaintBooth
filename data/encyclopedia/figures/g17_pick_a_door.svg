<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 369" width="640" height="369" role="img" aria-labelledby="t d"><title id="t">PRO or CHAT</title><desc id="d">Two cards. PRO for exact control, CHAT for typing what you want.</desc><rect width="640" height="369" fill="#0b0e17"/><text x="16.0" y="30.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="20" fill="#eef2f9" text-anchor="start" font-weight="700" >Pick a door: PRO or CHAT</text><text x="16.0" y="52.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#8794ad" text-anchor="start" >Both edit the same zones and the same car. Switch any time with the pill at the top.</text><rect x="14.0" y="77.3" width="612.0" height="132.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="14.0" y="85.3" width="4.0" height="116.0" rx="2" fill="#f5761a" /><rect x="30.0" y="95.3" width="90.0" height="96.0" rx="8" fill="#080a12" stroke="#f5761a" stroke-width="2" /><text x="75.0" y="151.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="20" fill="#f5761a" text-anchor="middle" font-weight="700" >PRO</text><text x="140.0" y="109.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="17" fill="#eef2f9" text-anchor="start" font-weight="700" >I want exact control</text><text x="140.0" y="133.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#c3ccdd" text-anchor="start" >Zones, finishes, layers, masks, spec tools and every slider. The</text><text x="140.0" y="152.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#c3ccdd" text-anchor="start" >full paint shop.</text><text x="140.0" y="174.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="start" >New buyers can feel lost here. Start with Chat, or turn on the</text><text x="140.0" y="191.9" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="start" >Tutorial.</text><rect x="14.0" y="219.3" width="612.0" height="132.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="14.0" y="227.3" width="4.0" height="116.0" rx="2" fill="#00e5ff" /><rect x="30.0" y="237.3" width="90.0" height="96.0" rx="8" fill="#080a12" stroke="#00e5ff" stroke-width="2" /><text x="75.0" y="293.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="20" fill="#00e5ff" text-anchor="middle" font-weight="700" >CHAT</text><text x="140.0" y="251.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="17" fill="#eef2f9" text-anchor="start" font-weight="700" >I want to just say it</text><text x="140.0" y="275.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#c3ccdd" text-anchor="start" >Type what you want in plain words: make the hood matte black.</text><text x="140.0" y="294.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#c3ccdd" text-anchor="start" >Watch the car change.</text><text x="140.0" y="316.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="start" >Works with no key. A key or Claude / ChatGPT makes it smarter. Every</text><text x="140.0" y="333.9" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="start" >change has Undo.</text></svg>
