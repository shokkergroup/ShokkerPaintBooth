<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 586" width="640" height="586" role="img" aria-labelledby="t d"><title id="t">What a finish mainly controls</title><desc id="d">Five stacked cards naming the families: shine only, pattern design, pattern with its own colour, fine structural colour, and everything, with example category names.</desc><rect width="640" height="586" fill="#0b0e17"/><text x="16.0" y="30.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="20" fill="#eef2f9" text-anchor="start" font-weight="700" >What each kind of finish mainly controls</text><text x="16.0" y="52.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#8794ad" text-anchor="start" >Some finishes change the colour, some only the shine. The catalogue is grouped that</text><text x="16.0" y="71.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#8794ad" text-anchor="start" >way.</text><rect x="14.0" y="96.6" width="612.0" height="88.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="14.0" y="104.6" width="4.0" height="72.0" rx="2" fill="#4cc38a" /><text x="32.0" y="124.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="17" fill="#4cc38a" text-anchor="start" font-weight="700" >Shine only</text><text x="32.0" y="146.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#eef2f9" text-anchor="start" font-weight="700" >Foundation, Clearcoat, Ghost Geometry</text><text x="32.0" y="168.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13.5" fill="#c3ccdd" text-anchor="start" >Your paint stays as it is. The spec map does the work.</text><rect x="14.0" y="192.6" width="612.0" height="88.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="14.0" y="200.6" width="4.0" height="72.0" rx="2" fill="#00e5ff" /><text x="32.0" y="220.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="17" fill="#00e5ff" text-anchor="start" font-weight="700" >Pattern design</text><text x="32.0" y="242.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#eef2f9" text-anchor="start" font-weight="700" >Carbon &amp; Weave, Geometric, Optical, Decades 50s to 90s</text><text x="32.0" y="264.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13.5" fill="#c3ccdd" text-anchor="start" >The shape of the pattern matters. Its colour does not.</text><rect x="14.0" y="288.6" width="612.0" height="88.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="14.0" y="296.6" width="4.0" height="72.0" rx="2" fill="#ff3366" /><text x="32.0" y="316.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="17" fill="#ff3366" text-anchor="start" font-weight="700" >Pattern with its own colour</text><text x="32.0" y="338.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#eef2f9" text-anchor="start" font-weight="700" >Cultural</text><text x="32.0" y="360.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13.5" fill="#c3ccdd" text-anchor="start" >Image-based patterns that bring their colours with them.</text><rect x="14.0" y="384.6" width="612.0" height="88.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="14.0" y="392.6" width="4.0" height="72.0" rx="2" fill="#ffaa00" /><text x="32.0" y="412.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="17" fill="#ffaa00" text-anchor="start" font-weight="700" >Fine structural colour</text><text x="32.0" y="434.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#eef2f9" text-anchor="start" font-weight="700" >Neon, ASTRA, FRACTURED lanes</text><text x="32.0" y="456.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13.5" fill="#c3ccdd" text-anchor="start" >Tiny 8 to 32 pixel structure with colour and shine that move together.</text><rect x="14.0" y="480.6" width="612.0" height="88.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="14.0" y="488.6" width="4.0" height="72.0" rx="2" fill="#f5761a" /><text x="32.0" y="508.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="17" fill="#f5761a" text-anchor="start" font-weight="700" >Everything (paint and shine)</text><text x="32.0" y="530.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#eef2f9" text-anchor="start" font-weight="700" >All other categories, including Foundation EFX</text><text x="32.0" y="552.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13.5" fill="#c3ccdd" text-anchor="start" >The finish sets both colour and shine.</text></svg>
