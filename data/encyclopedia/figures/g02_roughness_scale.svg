<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 421" width="640" height="421" role="img" aria-labelledby="t d"><title id="t">Roughness scale</title><desc id="d">A bar from mirror on the left to matte on the right with four spheres whose highlight gets softer: Chrome G 2, Gloss G 30, Satin G 95, Soft matte G 200.</desc><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#04100a"/><stop offset="1" stop-color="#43d68a"/></linearGradient><radialGradient id="sp1b" cx="0.4" cy="0.35" r="0.8"><stop offset="0" stop-color="#6b7488"/><stop offset="1" stop-color="#1a1e2c"/></radialGradient><filter id="sp1f" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="0.5"/></filter><clipPath id="sp1c"><circle cx="44.4" cy="123.32" r="26"/></clipPath><radialGradient id="sp2b" cx="0.4" cy="0.35" r="0.8"><stop offset="0" stop-color="#6b7488"/><stop offset="1" stop-color="#1a1e2c"/></radialGradient><filter id="sp2f" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="1.7"/></filter><clipPath id="sp2c"><circle cx="105.9" cy="123.32" r="26"/></clipPath><radialGradient id="sp3b" cx="0.4" cy="0.35" r="0.8"><stop offset="0" stop-color="#6b7488"/><stop offset="1" stop-color="#1a1e2c"/></radialGradient><filter id="sp3f" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4.5"/></filter><clipPath id="sp3c"><circle cx="248.6" cy="123.32" r="26"/></clipPath><radialGradient id="sp4b" cx="0.4" cy="0.35" r="0.8"><stop offset="0" stop-color="#6b7488"/><stop offset="1" stop-color="#1a1e2c"/></radialGradient><filter id="sp4f" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9.0"/></filter><clipPath id="sp4c"><circle cx="479.2" cy="123.32" r="26"/></clipPath></defs><rect width="640" height="421" fill="#0b0e17"/><text x="16.0" y="30.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="20" fill="#eef2f9" text-anchor="start" font-weight="700" >G = Roughness: from mirror to matte</text><text x="16.0" y="52.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#8794ad" text-anchor="start" >The lower the green number, the sharper the reflection.</text><rect x="40.0" y="173.3" width="560.0" height="26.0" rx="4" fill="url(#rg)" stroke="#2a3150" stroke-width="1" /><circle cx="44.4" cy="123.3" r="26" fill="url(#sp1b)" /><g clip-path="url(#sp1c)"><ellipse cx="36.4" cy="114.32" rx="5.2" ry="4.1" fill="#ffffff" opacity="0.99" filter="url(#sp1f)"/></g><line x1="44.4" y1="151.3" x2="44.4" y2="173.3" stroke="#8794ad" stroke-width="1.5" /><circle cx="44.4" cy="186.3" r="6" fill="#ffaa00" stroke="#0b0e17" stroke-width="2" /><text x="44.4" y="229.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#eef2f9" text-anchor="middle" font-weight="700" >Chrome</text><text x="44.4" y="247.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#43d68a" text-anchor="middle" font-weight="700" >G = 2</text><circle cx="105.9" cy="123.3" r="26" fill="url(#sp2b)" /><g clip-path="url(#sp2c)"><ellipse cx="97.9" cy="114.32" rx="7.4" ry="5.9" fill="#ffffff" opacity="0.92" filter="url(#sp2f)"/></g><line x1="105.9" y1="151.3" x2="105.9" y2="173.3" stroke="#8794ad" stroke-width="1.5" /><circle cx="105.9" cy="186.3" r="6" fill="#ffaa00" stroke="#0b0e17" stroke-width="2" /><text x="105.9" y="229.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#eef2f9" text-anchor="middle" font-weight="700" >Gloss</text><text x="105.9" y="247.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#43d68a" text-anchor="middle" font-weight="700" >G = 30</text><circle cx="248.6" cy="123.3" r="26" fill="url(#sp3b)" /><g clip-path="url(#sp3c)"><ellipse cx="240.6" cy="114.32" rx="12.5" ry="10.0" fill="#ffffff" opacity="0.74" filter="url(#sp3f)"/></g><line x1="248.6" y1="151.3" x2="248.6" y2="173.3" stroke="#8794ad" stroke-width="1.5" /><circle cx="248.6" cy="186.3" r="6" fill="#ffaa00" stroke="#0b0e17" stroke-width="2" /><text x="248.6" y="229.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#eef2f9" text-anchor="middle" font-weight="700" >Satin</text><text x="248.6" y="247.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#43d68a" text-anchor="middle" font-weight="700" >G = 95</text><circle cx="479.2" cy="123.3" r="26" fill="url(#sp4b)" /><g clip-path="url(#sp4c)"><ellipse cx="471.2" cy="114.32" rx="20.7" ry="16.5" fill="#ffffff" opacity="0.45" filter="url(#sp4f)"/></g><line x1="479.2" y1="151.3" x2="479.2" y2="173.3" stroke="#8794ad" stroke-width="1.5" /><circle cx="479.2" cy="186.3" r="6" fill="#ffaa00" stroke="#0b0e17" stroke-width="2" /><text x="479.2" y="229.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#eef2f9" text-anchor="middle" font-weight="700" >Soft matte</text><text x="479.2" y="247.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#43d68a" text-anchor="middle" font-weight="700" >G = 200</text><line x1="40.0" y1="199.3" x2="40.0" y2="205.3" stroke="#8794ad" stroke-width="1.5" /><line x1="180.5" y1="199.3" x2="180.5" y2="205.3" stroke="#8794ad" stroke-width="1.5" /><line x1="321.1" y1="199.3" x2="321.1" y2="205.3" stroke="#8794ad" stroke-width="1.5" /><line x1="461.6" y1="199.3" x2="461.6" y2="205.3" stroke="#8794ad" stroke-width="1.5" /><line x1="600.0" y1="199.3" x2="600.0" y2="205.3" stroke="#8794ad" stroke-width="1.5" /><text x="40.0" y="285.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="start" font-weight="700" >0</text><text x="600.0" y="285.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="end" font-weight="700" >255</text><text x="64.0" y="285.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="start" >mirror, sharp reflections</text><text x="570.0" y="285.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="end" >flat, soft glow</text><rect x="14.0" y="307.3" width="612.0" height="96.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="14.0" y="315.3" width="4.0" height="80.0" rx="2" fill="#f5761a" /><text x="32.0" y="335.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="16" fill="#eef2f9" text-anchor="start" font-weight="700" >The floor of 15</text><text x="32.0" y="357.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#c3ccdd" text-anchor="start" >Any pixel that is not a mirror metal (metallic below 240) is held at roughness 15</text><text x="32.0" y="376.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#c3ccdd" text-anchor="start" >or higher. Only true chrome-level metal may go lower, down to 0.</text></svg>
