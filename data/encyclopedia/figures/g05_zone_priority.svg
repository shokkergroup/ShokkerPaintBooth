<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 541" width="640" height="541" role="img" aria-labelledby="t d"><title id="t">Zone priority</title><desc id="d">A stack of Zone 1, Zone 2 and Everything Else with a priority arrow. Two overlapping boxes show the overlap taking the colour of the higher zone, and the colour flips when the zones are swapped.</desc><rect width="640" height="541" fill="#0b0e17"/><text x="16.0" y="30.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="20" fill="#eef2f9" text-anchor="start" font-weight="700" >Zones: the one on top wins</text><text x="16.0" y="52.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#8794ad" text-anchor="start" >Where two zones both claim a pixel, the higher one gets it. Lower number = stronger.</text><rect x="14.0" y="77.3" width="292.0" height="100.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="14.0" y="85.3" width="4.0" height="84.0" rx="2" fill="#f5761a" /><text x="32.0" y="105.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="17" fill="#eef2f9" text-anchor="start" font-weight="700" >Zone 1</text><text x="32.0" y="127.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#f5761a" text-anchor="start" font-weight="700" >Hood stripe</text><text x="32.0" y="149.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="start" >wins every overlap</text><rect x="14.0" y="189.3" width="292.0" height="100.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="14.0" y="197.3" width="4.0" height="84.0" rx="2" fill="#00e5ff" /><text x="32.0" y="217.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="17" fill="#eef2f9" text-anchor="start" font-weight="700" >Zone 2</text><text x="32.0" y="239.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#00e5ff" text-anchor="start" font-weight="700" >Body colour</text><text x="32.0" y="261.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="start" >wins what Zone 1 leaves</text><rect x="14.0" y="301.3" width="292.0" height="112.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="14.0" y="309.3" width="4.0" height="96.0" rx="2" fill="#8794ad" /><text x="32.0" y="329.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="17" fill="#eef2f9" text-anchor="start" font-weight="700" >Everything Else</text><text x="32.0" y="351.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#8794ad" text-anchor="start" font-weight="700" >Remaining (catch-all)</text><text x="32.0" y="373.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="start" >always last: gets only what nobody</text><text x="32.0" y="391.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="start" >above claims</text><line x1="316.0" y1="87.3" x2="316.0" y2="405.3" stroke="#8794ad" stroke-width="2" /><polygon points="316.0,405.3 312.1,397.2 319.9,397.2" fill="#8794ad"/><text x="340.0" y="83.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#eef2f9" text-anchor="start" font-weight="700" >Zone 1 above 2: overlap is Zone 1</text><rect x="340.0" y="93.3" width="286.0" height="118.0" rx="6" fill="#080a12" stroke="#2a3150" stroke-width="1.2" /><rect x="360.0" y="111.3" width="160.0" height="82.0" rx="4" fill="#f5761a" opacity="0.85"/><rect x="440.0" y="127.3" width="166.0" height="66.0" rx="4" fill="#00e5ff" opacity="0.85"/><rect x="440.0" y="127.3" width="80.0" height="66.0" rx="0" fill="#f5761a" /><rect x="440.0" y="127.3" width="80.0" height="66.0" rx="0" fill="none" stroke="#eef2f9" stroke-width="2" stroke-dasharray="5 4"/><text x="400.0" y="157.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#0b0e17" text-anchor="middle" font-weight="700" >Zone 1</text><text x="564.0" y="171.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#0b0e17" text-anchor="middle" font-weight="700" >Zone 2</text><text x="480.0" y="183.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#0b0e17" text-anchor="middle" font-weight="700" >overlap</text><text x="483.0" y="239.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="middle" font-style="italic" >drag a zone to swap</text><line x1="483.0" y1="245.3" x2="483.0" y2="263.3" stroke="#8794ad" stroke-width="2" /><polygon points="483.0,263.3 479.1,255.2 486.9,255.2" fill="#8794ad"/><text x="340.0" y="285.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#eef2f9" text-anchor="start" font-weight="700" >Swapped: overlap now goes to Zone 2</text><rect x="340.0" y="295.3" width="286.0" height="118.0" rx="6" fill="#080a12" stroke="#2a3150" stroke-width="1.2" /><rect x="360.0" y="313.3" width="160.0" height="82.0" rx="4" fill="#f5761a" opacity="0.85"/><rect x="440.0" y="329.3" width="166.0" height="66.0" rx="4" fill="#00e5ff" opacity="0.85"/><rect x="440.0" y="329.3" width="80.0" height="66.0" rx="0" fill="#00e5ff" /><rect x="440.0" y="329.3" width="80.0" height="66.0" rx="0" fill="none" stroke="#eef2f9" stroke-width="2" stroke-dasharray="5 4"/><text x="400.0" y="359.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#0b0e17" text-anchor="middle" font-weight="700" >Zone 1</text><text x="564.0" y="373.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#0b0e17" text-anchor="middle" font-weight="700" >Zone 2</text><text x="480.0" y="385.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#0b0e17" text-anchor="middle" font-weight="700" >overlap</text><rect x="14.0" y="447.3" width="612.0" height="76.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="14.0" y="455.3" width="4.0" height="60.0" rx="2" fill="#f5761a" /><text x="32.0" y="475.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#c3ccdd" text-anchor="start" >Hiding a zone with its eye icon is only for testing. Zones that sit lower never</text><text x="32.0" y="494.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#c3ccdd" text-anchor="start" >get pixels a higher zone already owns.</text></svg>
