<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 581" width="640" height="581" role="img" aria-labelledby="t d"><title id="t">The spec map: four channels</title><desc id="d">Four cards for the spec map channels. R metallic from 0 plain paint to 255 bare metal. G roughness from 0 mirror to 255 matte. B clearcoat where 16 is maximum gloss and 255 is dull. A spec mask from 0 transparent to 255 active.</desc><defs><linearGradient id="gr0" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000000"/><stop offset="1" stop-color="#ff5d6c"/></linearGradient><linearGradient id="gr1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000000"/><stop offset="1" stop-color="#43d68a"/></linearGradient><linearGradient id="gr2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000000"/><stop offset="1" stop-color="#5b8cff"/></linearGradient><linearGradient id="gr3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2a2f3f"/><stop offset="1" stop-color="#c3ccdd"/></linearGradient></defs><rect width="640" height="581" fill="#0b0e17"/><text x="16.0" y="30.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="20" fill="#eef2f9" text-anchor="start" font-weight="700" >The spec map: four channels per pixel</text><text x="16.0" y="52.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#8794ad" text-anchor="start" >Next to your paint, iRacing reads a second picture. Each pixel carries four numbers</text><text x="16.0" y="71.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#8794ad" text-anchor="start" >from 0 to 255.</text><rect x="12.0" y="96.6" width="305.0" height="192.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="12.0" y="104.6" width="4.0" height="176.0" rx="2" fill="#ff5d6c" /><circle cx="48.0" cy="130.6" r="18" fill="#ff5d6c" /><text x="48.0" y="137.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="22" fill="#0b0e17" text-anchor="middle" font-weight="700" >R</text><text x="78.0" y="137.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="19" fill="#eef2f9" text-anchor="start" font-weight="700" >Metallic</text><rect x="30.0" y="172.6" width="269.0" height="20.0" rx="4" fill="url(#gr0)" stroke="#2a3150" stroke-width="1" /><text x="30.0" y="214.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#c3ccdd" text-anchor="start" >0 = plain paint</text><text x="299.0" y="214.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#c3ccdd" text-anchor="end" >255 = metal / chrome</text><text x="30.0" y="240.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="start" >More metal makes the body colour flash</text><text x="30.0" y="257.5" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="start" >harder.</text><rect x="331.0" y="96.6" width="305.0" height="192.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="331.0" y="104.6" width="4.0" height="176.0" rx="2" fill="#43d68a" /><circle cx="367.0" cy="130.6" r="18" fill="#43d68a" /><text x="367.0" y="137.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="22" fill="#0b0e17" text-anchor="middle" font-weight="700" >G</text><text x="397.0" y="137.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="19" fill="#eef2f9" text-anchor="start" font-weight="700" >Roughness</text><rect x="349.0" y="172.6" width="269.0" height="20.0" rx="4" fill="url(#gr1)" stroke="#2a3150" stroke-width="1" /><text x="349.0" y="214.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#c3ccdd" text-anchor="start" >0 = perfect mirror</text><text x="618.0" y="214.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#c3ccdd" text-anchor="end" >255 = flat matte</text><text x="349.0" y="240.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="start" >Low = sharp mirror flashes. High = soft</text><text x="349.0" y="257.5" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="start" >satin glow.</text><rect x="12.0" y="302.6" width="305.0" height="192.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="12.0" y="310.6" width="4.0" height="176.0" rx="2" fill="#5b8cff" /><circle cx="48.0" cy="336.6" r="18" fill="#5b8cff" /><text x="48.0" y="343.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="22" fill="#0b0e17" text-anchor="middle" font-weight="700" >B</text><text x="78.0" y="343.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="19" fill="#eef2f9" text-anchor="start" font-weight="700" >Clearcoat</text><rect x="30.0" y="378.6" width="269.0" height="20.0" rx="4" fill="url(#gr2)" stroke="#2a3150" stroke-width="1" /><line x1="46.9" y1="372.6" x2="46.9" y2="404.6" stroke="#ffaa00" stroke-width="2.5" /><text x="52.9" y="370.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#ffaa00" text-anchor="start" font-weight="700" >16 = MAX gloss</text><text x="30.0" y="420.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#c3ccdd" text-anchor="start" >0 = no coat</text><text x="299.0" y="420.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#c3ccdd" text-anchor="end" >255 = dull</text><text x="30.0" y="446.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="start" >Backwards on purpose: a smaller number</text><text x="30.0" y="463.5" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="start" >is a glossier coat. 0 means no coat at</text><text x="30.0" y="480.4" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="start" >all.</text><rect x="331.0" y="302.6" width="305.0" height="192.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="331.0" y="310.6" width="4.0" height="176.0" rx="2" fill="#c3ccdd" /><circle cx="367.0" cy="336.6" r="18" fill="#c3ccdd" /><text x="367.0" y="343.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="22" fill="#0b0e17" text-anchor="middle" font-weight="700" >A</text><text x="397.0" y="343.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="19" fill="#eef2f9" text-anchor="start" font-weight="700" >Spec mask</text><rect x="349.0" y="378.6" width="269.0" height="20.0" rx="4" fill="url(#gr3)" stroke="#2a3150" stroke-width="1" /><text x="349.0" y="420.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#c3ccdd" text-anchor="start" >0 = transparent</text><text x="618.0" y="420.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#c3ccdd" text-anchor="end" >255 = active pixel</text><text x="349.0" y="446.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="start" >Follows your zones. You never paint this</text><text x="349.0" y="463.5" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="start" >one by hand.</text><text x="16.0" y="520.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#8794ad" text-anchor="start" >It is data, not colour. Seen on screen the spec map looks odd (chrome shows bright</text><text x="16.0" y="540.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#8794ad" text-anchor="start" >red, gloss shows dark green-black) only because the four numbers are packed into red,</text><text x="16.0" y="559.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#8794ad" text-anchor="start" >green, blue and alpha.</text></svg>
