<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 512" width="640" height="512" role="img" aria-labelledby="t d"><title id="t">The three iron rules</title><desc id="d">Three cards. One: clearcoat 1 to 15 is not allowed and is raised to 16. Two: roughness has a floor of 15 except for mirror metals. Three: the spec mask follows the zones.</desc><defs><pattern id="hatch3" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#1c0b13"/><line x1="0" y1="0" x2="0" y2="7" stroke="#ff2e63" stroke-width="2.5"/></pattern></defs><rect width="640" height="512" fill="#0b0e17"/><text x="16.0" y="30.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="20" fill="#eef2f9" text-anchor="start" font-weight="700" >The three iron rules</text><text x="16.0" y="52.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#8794ad" text-anchor="start" >Shokker applies these to every spec map it makes, so a render cannot break them by</text><text x="16.0" y="71.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#8794ad" text-anchor="start" >accident.</text><rect x="14.0" y="96.6" width="612.0" height="128.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="14.0" y="104.6" width="4.0" height="112.0" rx="2" fill="#5b8cff" /><text x="32.0" y="124.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="17" fill="#eef2f9" text-anchor="start" font-weight="700" >1   Clearcoat is 16 or more (or exactly 0)</text><rect x="30.0" y="144.6" width="4.0" height="22.0" rx="0" fill="#4cc38a" /><rect x="34.2" y="144.6" width="33.4" height="22.0" rx="0" fill="url(#hatch3)" stroke="#ff2e63" stroke-width="1" /><rect x="67.6" y="144.6" width="532.4" height="22.0" rx="0" fill="#5b8cff" opacity="0.55"/><text x="42.0" y="186.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#4cc38a" text-anchor="start" font-weight="700" >0 ok</text><text x="77.8" y="186.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#ff2e63" text-anchor="start" font-weight="700" >1-15 raised to 16</text><text x="217.6" y="186.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#5b8cff" text-anchor="start" font-weight="700" >16 to 255 ok</text><text x="32.0" y="210.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="start" >The values 1 to 15 whiten the paint in iRacing's shader.</text><rect x="14.0" y="238.6" width="612.0" height="150.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="14.0" y="246.6" width="4.0" height="134.0" rx="2" fill="#43d68a" /><text x="32.0" y="266.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="17" fill="#eef2f9" text-anchor="start" font-weight="700" >2   Roughness is 15 or more, unless it is a mirror metal</text><rect x="32.0" y="284.6" width="184.0" height="70.0" rx="8" fill="#171c2e" stroke="#2a3150" stroke-width="1" /><text x="42.0" y="306.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#eef2f9" text-anchor="start" font-weight="700" >Gloss paint</text><text x="42.0" y="326.6" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#8794ad" text-anchor="start" >M 0 / G 30</text><text x="42.0" y="346.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#4cc38a" text-anchor="start" font-weight="700" >stays 30</text><rect x="228.0" y="284.6" width="184.0" height="70.0" rx="8" fill="#171c2e" stroke="#2a3150" stroke-width="1" /><text x="238.0" y="306.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#eef2f9" text-anchor="start" font-weight="700" >Chrome</text><text x="238.0" y="326.6" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#8794ad" text-anchor="start" >M 255 / G 2</text><text x="238.0" y="346.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#4cc38a" text-anchor="start" font-weight="700" >stays 2 (mirror metal)</text><rect x="424.0" y="284.6" width="184.0" height="70.0" rx="8" fill="#171c2e" stroke="#2a3150" stroke-width="1" /><text x="434.0" y="306.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#eef2f9" text-anchor="start" font-weight="700" >Too low (example)</text><text x="434.0" y="326.6" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#8794ad" text-anchor="start" >M 100 / G 5</text><text x="434.0" y="346.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#ff2e63" text-anchor="start" font-weight="700" >raised to 15</text><text x="32.0" y="376.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="start" >Mirror metal means metallic 240 or higher.</text><rect x="14.0" y="402.6" width="612.0" height="92.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="14.0" y="410.6" width="4.0" height="76.0" rx="2" fill="#c3ccdd" /><text x="32.0" y="430.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="17" fill="#eef2f9" text-anchor="start" font-weight="700" >3   The spec mask follows your zones</text><text x="32.0" y="454.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#c3ccdd" text-anchor="start" >Alpha comes from the union of your zone areas. It is not something you paint by</text><text x="32.0" y="474.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#c3ccdd" text-anchor="start" >hand.</text></svg>
