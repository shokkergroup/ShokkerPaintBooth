<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 512" width="640" height="512" role="img" aria-labelledby="t d"><title id="t">car_num_ vs car_</title><desc id="d">Two cards. Custom Number writes car_num_ID.tga and needs Hide Car Numbers ON. Sim-Stamped Number writes car_ID.tga, the default. Both also write car_spec_ID.tga.</desc><rect width="640" height="512" fill="#0b0e17"/><text x="16.0" y="30.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="20" fill="#eef2f9" text-anchor="start" font-weight="700" >car_num_ or car_ ? Two number modes</text><text x="16.0" y="52.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#8794ad" text-anchor="start" >There is no place to type a car number in Shokker. These switches only pick the file</text><text x="16.0" y="71.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#8794ad" text-anchor="start" >name.</text><rect x="14.0" y="96.6" width="300.0" height="212.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="14.0" y="104.6" width="4.0" height="196.0" rx="2" fill="#f5761a" /><text x="32.0" y="126.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="18" fill="#eef2f9" text-anchor="start" font-weight="700" >Custom Number</text><rect x="32.0" y="142.6" width="264.0" height="38.0" rx="6" fill="#080a12" stroke="#f5761a" stroke-width="1.5" /><text x="164.0" y="167.6" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#f5761a" text-anchor="middle" font-weight="700" >car_num_&lt;ID&gt;.tga</text><text x="32.0" y="208.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#c3ccdd" text-anchor="start" >Your paint carries its own number.</text><text x="32.0" y="236.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#8794ad" text-anchor="start" >iRacing loads it when Graphics &gt;</text><text x="32.0" y="255.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#8794ad" text-anchor="start" >Hide Car Numbers is ON.</text><rect x="326.0" y="96.6" width="300.0" height="212.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="326.0" y="104.6" width="4.0" height="196.0" rx="2" fill="#00e5ff" /><text x="344.0" y="126.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="18" fill="#eef2f9" text-anchor="start" font-weight="700" >Sim-Stamped Number</text><rect x="344.0" y="142.6" width="264.0" height="38.0" rx="6" fill="#080a12" stroke="#00e5ff" stroke-width="1.5" /><text x="476.0" y="167.6" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#00e5ff" text-anchor="middle" font-weight="700" >car_&lt;ID&gt;.tga</text><text x="344.0" y="208.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#c3ccdd" text-anchor="start" >iRacing stamps your number and</text><text x="344.0" y="228.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#c3ccdd" text-anchor="start" >sponsors on top.</text><text x="344.0" y="255.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#8794ad" text-anchor="start" >iRacing loads it by default (Hide</text><text x="344.0" y="274.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#8794ad" text-anchor="start" >Car Numbers OFF).</text><rect x="14.0" y="324.6" width="612.0" height="62.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="14.0" y="332.6" width="4.0" height="46.0" rx="2" fill="#4cc38a" /><text x="32.0" y="350.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#c3ccdd" text-anchor="start" >Both modes also write</text><text x="212.0" y="350.6" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#4cc38a" text-anchor="start" font-weight="700" >car_spec_&lt;ID&gt;.tga</text><text x="380.0" y="350.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#c3ccdd" text-anchor="start" >(the shine)</text><text x="32.0" y="374.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="start" >The paint tells iRacing the colour. The spec file tells it how shiny.</text><rect x="14.0" y="400.6" width="612.0" height="94.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="14.0" y="408.6" width="4.0" height="78.0" rx="2" fill="#ff2e63" /><text x="32.0" y="428.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="16" fill="#eef2f9" text-anchor="start" font-weight="700" >The switch and the iRacing setting must agree</text><text x="32.0" y="450.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#c3ccdd" text-anchor="start" >If they do not, iRacing finds no file and quietly shows your paint-shop colours.</text><text x="32.0" y="470.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#c3ccdd" text-anchor="start" >Not sure? Render once in each mode: both files stay in the folder and iRacing</text><text x="32.0" y="489.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#c3ccdd" text-anchor="start" >picks the right one.</text></svg>
