<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPB Workbench</title>
<style>
  :root{--bg:#0c0e13;--panel:#151922;--panel2:#1b212c;--line:#262d3a;--txt:#e7eaf1;--dim:#8d96a8;
        --gold:#e8c050;--blue:#4a6ed0;--green:#3dbb6e;--red:#c23b4a;--amber:#d98a2b;--violet:#8a6dd0;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 "Segoe UI",system-ui,sans-serif;}
  header{position:sticky;top:0;z-index:30;background:#0e1119ee;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 18px;}
  .brand{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .brand h1{margin:0;font-size:17px;letter-spacing:.5px;}
  .brand h1 b{color:var(--gold);}
  .stat{color:var(--dim);font-size:12px;}
  .stat b{color:var(--txt);}
  .tabs{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .tab{background:#181d27;color:var(--dim);border:1px solid var(--line);border-radius:8px 8px 0 0;padding:8px 16px;cursor:pointer;font-size:13px;font-weight:600;}
  .tab.on{background:var(--panel);color:var(--gold);border-bottom-color:var(--panel);}
  .tab .c{color:var(--dim);font-weight:400;margin-left:6px;font-size:11px;}
  main{padding:14px 18px 80px;}
  .filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
  .filters input[type=search]{background:#0e1219;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 12px;min-width:220px;}
  .fchip{background:#181d27;border:1px solid var(--line);color:var(--dim);border-radius:14px;padding:5px 12px;font-size:12px;cursor:pointer;}
  .fchip.on{background:#2a2238;border-color:var(--violet);color:#d9ccf5;}
  select{background:#0e1219;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 10px;}
  .groupwrap{margin-bottom:22px;}
  .grouphdr{font-size:13px;letter-spacing:1.5px;color:var(--gold);border-bottom:1px solid var(--line);padding:6px 2px;margin-bottom:12px;text-transform:uppercase;}
  .grouphdr .gc{color:var(--dim);letter-spacing:0;font-size:11px;font-weight:400;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;}
  .card.rated{border-color:#2e4a39;}
  .card.edited{border-color:var(--amber);}
  .sw{width:100%;display:block;background:#000;aspect-ratio:2.02/1;object-fit:cover;cursor:zoom-in;}
  .lbox{position:fixed;inset:0;background:rgba(0,0,0,.93);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:9999;cursor:zoom-out;padding:18px;}
  .lbox.on{display:flex;}
  .lbox img{max-width:98vw;max-height:86vh;object-fit:contain;border:1px solid #2a3340;border-radius:8px;image-rendering:auto;}
  .lbox .lcap{color:#cfe7ff;margin-top:12px;font:14px "Segoe UI",sans-serif;text-align:center;}
  .cbody{padding:9px 11px 11px;display:flex;flex-direction:column;gap:7px;}
  .crow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .cname{font-weight:650;font-size:14px;}
  .badges{display:flex;gap:5px;flex-wrap:wrap;align-items:center;}
  .pill{font-size:10.5px;border-radius:10px;padding:2px 8px;white-space:nowrap;background:#222a3a;color:var(--dim);}
  .pill.v-keep{background:#1e3a2a;color:#7fd49a;} .pill.v-remove{background:#3a1e23;color:#ff9aa6;}
  .pill.v-rebuild,.pill.v-replace{background:#3a2f1c;color:#e8c050;} .pill.v-rename{background:#1e2a3a;color:#8fb4ff;}
  .pill.rate{background:#222a3a;color:var(--gold);font-weight:700;}
  .pill.ed{background:#3a2f1c;color:var(--amber);}
  .cid{color:var(--dim);font-size:10.5px;font-family:Consolas,monospace;}
  .cdesc{color:#bcc4d2;font-size:12px;max-height:2.9em;overflow:hidden;}
  .cmeta{color:var(--dim);font-size:10.5px;}
  .rate-panel{display:none;flex-direction:column;gap:7px;border-top:1px solid var(--line);margin-top:3px;padding-top:8px;}
  .card.open .rate-panel{display:flex;}
  .verds{display:flex;gap:5px;flex-wrap:wrap;}
  .v{flex:1;min-width:58px;padding:6px 0;border-radius:6px;border:1px solid var(--line);background:#1b212d;color:var(--txt);cursor:pointer;font-size:12px;}
  .v:hover{border-color:var(--gold);}
  .v.on{background:var(--blue);border-color:var(--blue);font-weight:600;}
  .v.keep.on{background:var(--green);border-color:var(--green);}
  .v.remove.on{background:var(--red);border-color:var(--red);}
  .raterow{display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--dim);}
  .raterow output{color:var(--gold);font-weight:700;width:24px;}
  input[type=range]{flex:1;accent-color:var(--gold);}
  .chips{display:flex;flex-wrap:wrap;gap:4px;}
  .chip{background:#1b212d;border:1px solid var(--line);color:var(--dim);border-radius:11px;padding:3px 9px;font-size:11px;cursor:pointer;}
  .chip.on{background:#2a2238;border-color:var(--violet);color:#d9ccf5;}
  textarea{background:#0e1219;border:1px solid var(--line);color:var(--txt);border-radius:7px;min-height:38px;padding:6px 9px;font:12px "Segoe UI",sans-serif;resize:vertical;width:100%;}
  .savebtn{padding:8px;font-weight:800;border:none;border-radius:7px;cursor:pointer;background:var(--gold);color:#10131a;letter-spacing:.5px;}
  .hist{color:var(--dim);font-size:11px;}
  .hist a{color:var(--blue);cursor:pointer;}
  /* bugs + worklog */
  .panecol{max-width:880px;}
  .addbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:16px;display:flex;flex-direction:column;gap:8px;}
  .addbox input,.addbox textarea{background:#0e1219;border:1px solid var(--line);color:var(--txt);border-radius:7px;padding:8px 10px;}
  .addbox .frow{display:flex;gap:8px;}
  .addbtn{align-self:flex-start;background:var(--blue);color:#fff;border:none;border-radius:7px;padding:9px 18px;font-weight:700;cursor:pointer;}
  .bug{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;}
  .bug.done{opacity:.6;}
  .bug .bh{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .bug .bt{font-weight:650;font-size:14px;}
  .bug .bb{color:#c2cad8;font-size:12.5px;margin:6px 0;white-space:pre-wrap;}
  .sev{font-size:10px;border-radius:9px;padding:2px 7px;background:#222a3a;color:var(--dim);}
  .sev.high{background:#3a1e23;color:#ff9aa6;} .sev.low{background:#1e3a2a;color:#7fd49a;}
  .comments{border-top:1px solid var(--line);margin-top:8px;padding-top:8px;display:flex;flex-direction:column;gap:6px;}
  .cm{font-size:12px;color:#c2cad8;} .cm .who{color:var(--dim);font-size:10.5px;}
  .wl{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--violet);border-radius:7px;padding:9px 12px;margin-bottom:8px;}
  .wl .when{color:var(--dim);font-size:10.5px;}
  .wl .tags{color:var(--violet);font-size:10.5px;}
  #toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1e2a3a;color:#fff;padding:10px 20px;border-radius:8px;opacity:0;transition:opacity .25s;z-index:60;border:1px solid var(--line);}
  #toast.show{opacity:1;}
  .empty{color:var(--dim);padding:30px;text-align:center;}
</style></head>
<body>
<header>
  <div class="brand">
    <h1>SPB <b>Workbench</b></h1>
    <span class="stat" id="stat"></span>
  </div>
  <div class="tabs" id="tabs"></div>
</header>
<main id="main"><div class="empty">Loading the library…</div></main>
<div id="toast"></div>
<script>
(function(){
"use strict";
var API = "/api/workbench";
// Reason taxonomy (multi-select) — SPB-specific so Ricky clicks instead of typing.
var COMMON = ["Too plain / boring","Too flat (no depth)","Not enough fine detail","Too blobby / macro dominates",
  "Too noisy / busy","Looks like a recolor clone","Too similar to another","Not original / low effort",
  "Name doesn't match the look","Wrong vibe for the category","Colors muddy / dull","Not color-diverse enough",
  "Clips / blown out","Too dark on car","Too bright / washed out","Banding / posterization",
  "Detail won't survive on car","Not UV-agnostic (straight/upright)","Render time too long",
  "Broken / artifacts","Other (see notes)"];
var EXTRA = {
  finishes:["Sheen baked into albedo","Weak / wrong spec colors","Spec doesn't match the paint",
    "No angle-reveal ignition","Metallic flake too coarse","Metallic flake too fine","Candy/pearl shift too weak"],
  patterns:["Doesn't tile / seams","Tiles whole car / wrong scale","Too sparse","Too dense / cluttered","Edges too soft / mushy"],
  spec_overlays:["Weak spec colors","Channels correlated / single-hue","No angle reveal","Too subtle on car",
    "Too harsh / blown","Dead / flat zone","Doesn't read as intentional design"]};
var VERDICTS=["keep","replace","rebuild","rename","remove"];
var TABS=[["finishes","Finishes"],["patterns","Patterns"],["spec_overlays","Spec Overlays"],["similarity","Similarity"],["bugs","Bugs"],["worklog","Worklog"]];

var state={cat:null,active:"finishes",filter:{q:"",mode:"all",group:""}};
var el=function(id){return document.getElementById(id);};
function toast(t,bad){var x=el("toast");x.textContent=t;x.style.borderColor=bad?"#c23b4a":"#3dbb6e";x.classList.add("show");setTimeout(function(){x.classList.remove("show");},2200);}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");}
function fmtDate(sec){if(!sec)return"—";var d=new Date(sec*1000);return d.toISOString().slice(0,10);}
function fmtTs(ms){if(!ms)return"";var d=new Date(ms);return d.toISOString().slice(0,16).replace("T"," ");}
function api(path,opts){return fetch(API+path,opts).then(function(r){return r.json();});}

function renderTabs(){
  var c=state.cat,counts={};
  if(c){["finishes","patterns","spec_overlays"].forEach(function(t){counts[t]=(c.sections[t]||[]).reduce(function(a,g){return a+g.items.length;},0);});}
  el("tabs").innerHTML=TABS.map(function(t){
    var cc=counts[t[0]]!=null?'<span class="c">'+counts[t[0]]+'</span>':'';
    return '<div class="tab'+(state.active===t[0]?' on':'')+'" data-tab="'+t[0]+'">'+t[1]+cc+'</div>';
  }).join("");
  Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(b){
    b.onclick=function(){state.active=b.getAttribute("data-tab");route();};});
}
function renderStat(){
  if(!state.cat){el("stat").textContent="";return;}
  var s=state.cat.stats;
  el("stat").innerHTML="<b>"+s.total+"</b> items · <b>"+s.rated+"</b> rated · <b>"+s.edited_since+"</b> edited since you rated them";
}

function matches(it){
  var f=state.filter;
  if(f.group&&it.group!==f.group)return false;
  if(f.q){var q=f.q.toLowerCase();if((it.name||"").toLowerCase().indexOf(q)<0&&it.id.toLowerCase().indexOf(q)<0)return false;}
  if(f.mode==="unrated")return!it.verdict&&!it.rating;
  if(f.mode==="edited")return!!it.edited_since;
  if(VERDICTS.indexOf(f.mode)>=0)return it.verdict===f.mode;
  return true;
}

function card(it){
  var d=document.createElement("div");
  d.className="card"+(it.verdict||it.rating?" rated":"")+(it.edited_since?" edited":"");
  d.setAttribute("data-id",it.id);d.setAttribute("data-kind",it.kind);
  var bdg=[];
  if(it.rating)bdg.push('<span class="pill rate">'+it.rating+'</span>');
  if(it.verdict)bdg.push('<span class="pill v-'+it.verdict+'">'+it.verdict+'</span>');
  if(it.edited_since)bdg.push('<span class="pill ed">edited since rated</span>');
  var chips=(EXTRA[state.active]||[]).concat(COMMON);
  d.innerHTML=''+
    '<img class="sw" loading="lazy" src="'+API+'/swatch/'+encodeURIComponent(it.kind)+'/'+encodeURIComponent(it.id)+'?size=416&v='+encodeURIComponent(it.src_mtime||0)+'" alt="'+esc(it.id)+'">'+
    '<div class="cbody">'+
      '<div class="crow"><span class="cname">'+esc(it.name||it.id)+'</span><span class="badges">'+bdg.join("")+'</span></div>'+
      '<div class="cid">'+esc(it.id)+'</div>'+
      (it.desc?'<div class="cdesc">'+esc(it.desc)+'</div>':'')+
      '<div class="cmeta">last edited '+fmtDate(it.src_mtime)+(it.rating_ts?' · rated '+fmtTs(it.rating_ts):' · never rated')+'</div>'+
      '<div class="rate-panel">'+
        '<div class="verds">'+VERDICTS.map(function(v){return '<button class="v '+v+(it.verdict===v?' on':'')+'" data-v="'+v+'">'+v+'</button>';}).join("")+'</div>'+
        '<div class="raterow"><label>Rating <output>'+(it.rating||50)+'</output></label><input type="range" min="1" max="100" step="1" value="'+(it.rating||50)+'"></div>'+
        '<div class="chips">'+chips.map(function(c){return '<span class="chip'+((it.reasons||[]).indexOf(c)>=0?' on':'')+'" data-c="'+esc(c)+'">'+esc(c)+'</span>';}).join("")+'</div>'+
        '<textarea placeholder="Notes — what would make it right?">'+esc(it.notes||"")+'</textarea>'+
        '<button class="savebtn">SAVE RATING</button>'+
        '<div class="hist"><a>history</a></div>'+
      '</div>'+
    '</div>';
  wireCard(d,it);
  return d;
}

function openZoom(it){
  var lb=document.getElementById("wbLbox");
  if(!lb){
    lb=document.createElement("div");lb.id="wbLbox";lb.className="lbox";
    lb.innerHTML='<img id="wbLboxImg" alt="zoom"><div class="lcap" id="wbLboxCap"></div>';
    document.body.appendChild(lb);
    lb.addEventListener("click",function(){lb.classList.remove("on");});
    document.addEventListener("keydown",function(e){if(e.key==="Escape")lb.classList.remove("on");});
  }
  document.getElementById("wbLboxImg").src=API+"/swatch/"+encodeURIComponent(it.kind)+"/"+encodeURIComponent(it.id)+"?size=1024";
  document.getElementById("wbLboxCap").textContent=(it.name||it.id)+"   —   PAINT (left)   |   SPEC (right:  R=Metalness · G=Roughness · B=Clearcoat)   —   click anywhere or Esc to close";
  lb.classList.add("on");
}

function wireCard(d,it){
  var img=d.querySelector(".sw"),panel=d.querySelector(".rate-panel");
  function toggle(){d.classList.toggle("open");}
  img.addEventListener("click",function(e){e.stopPropagation();openZoom(it);});
  d.querySelector(".cname").addEventListener("click",toggle);
  var draft={verdict:it.verdict||null,rating:it.rating||null,reasons:(it.reasons||[]).slice(),notes:it.notes||""};
  var vbtns=d.querySelectorAll(".v");
  Array.prototype.forEach.call(vbtns,function(b){b.addEventListener("click",function(){
    var on=b.classList.contains("on");
    Array.prototype.forEach.call(vbtns,function(x){x.classList.remove("on");});
    if(!on){b.classList.add("on");draft.verdict=b.getAttribute("data-v");}else draft.verdict=null;
  });});
  var slider=d.querySelector("input[type=range]"),out=d.querySelector("output");
  slider.addEventListener("input",function(){out.textContent=slider.value;draft.rating=parseInt(slider.value,10);});
  Array.prototype.forEach.call(d.querySelectorAll(".chip"),function(ch){ch.addEventListener("click",function(){
    ch.classList.toggle("on");var t=ch.getAttribute("data-c"),i=draft.reasons.indexOf(t);
    if(i>=0)draft.reasons.splice(i,1);else draft.reasons.push(t);
  });});
  var ta=d.querySelector("textarea");ta.addEventListener("input",function(){draft.notes=ta.value;});
  d.querySelector(".savebtn").addEventListener("click",function(){
    var body={id:it.id,kind:it.kind,verdict:draft.verdict,rating:draft.rating,reasons:draft.reasons,notes:draft.notes,ts:Date.now()};
    api("/rating",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
      .then(function(r){if(!r.ok)throw new Error(r.error||"save failed");
        // update in-memory item so badges/filters reflect immediately
        it.verdict=r.verdict;it.rating=r.rating;it.reasons=r.reasons;it.notes=r.notes;it.rating_ts=r.ts;it.edited_since=false;
        toast("Saved "+it.id+" ✓");renderStat();
        var fresh=card(it);fresh.classList.add("open");d.replaceWith(fresh);
      }).catch(function(e){toast(e.message,true);});
  });
  d.querySelector(".hist a").addEventListener("click",function(){
    api("/rating/"+encodeURIComponent(it.id)).then(function(r){
      var h=(r.history||[]).map(function(x){return fmtTs(x.ts)+"  "+(x.verdict||"—")+"  "+(x.rating||"")+(x.notes?"  ｜ "+x.notes:"");}).join("\n")||"no history";
      alert(it.id+"\n\n"+h);});
  });
}

function renderCatalogTab(){
  var m=el("main");m.innerHTML="";
  var allGroups=(state.cat.sections[state.active]||[]);
  var groupNames=allGroups.map(function(g){return g.group;});
  // filter bar
  var fb=document.createElement("div");fb.className="filters";
  var modes=[["all","All"],["unrated","Needs review"],["edited","Edited since rated"],["keep","Keep"],["rebuild","Rebuild"],["replace","Replace"],["rename","Rename"],["remove","Remove"]];
  fb.innerHTML='<input type="search" placeholder="search name or id…" value="'+esc(state.filter.q)+'">'+
    '<select class="grpsel"><option value="">All groups ('+groupNames.length+')</option>'+groupNames.map(function(g){return '<option'+(state.filter.group===g?' selected':'')+'>'+esc(g)+'</option>';}).join("")+'</select>'+
    modes.map(function(x){return '<span class="fchip'+(state.filter.mode===x[0]?' on':'')+'" data-m="'+x[0]+'">'+x[1]+'</span>';}).join("");
  m.appendChild(fb);
  fb.querySelector("input").addEventListener("input",function(e){state.filter.q=e.target.value;renderGroups(body);});
  fb.querySelector(".grpsel").addEventListener("change",function(e){state.filter.group=e.target.value;renderGroups(body);});
  Array.prototype.forEach.call(fb.querySelectorAll(".fchip"),function(c){c.addEventListener("click",function(){
    state.filter.mode=c.getAttribute("data-m");
    Array.prototype.forEach.call(fb.querySelectorAll(".fchip"),function(x){x.classList.remove("on");});
    c.classList.add("on");renderGroups(body);});});
  var body=document.createElement("div");m.appendChild(body);
  renderGroups(body);
}

function renderGroups(body){
  body.innerHTML="";var shown=0;
  (state.cat.sections[state.active]||[]).forEach(function(g){
    if(state.filter.group&&g.group!==state.filter.group)return;
    var items=g.items.filter(matches);if(!items.length)return;
    shown+=items.length;
    var wrap=document.createElement("div");wrap.className="groupwrap";
    var hdr=document.createElement("div");hdr.className="grouphdr";
    hdr.innerHTML=esc(g.group)+' <span class="gc">'+items.length+'/'+g.items.length+'</span>';
    wrap.appendChild(hdr);
    var grid=document.createElement("div");grid.className="grid";
    items.forEach(function(it){grid.appendChild(card(it));});
    wrap.appendChild(grid);body.appendChild(wrap);
  });
  if(!shown)body.innerHTML='<div class="empty">Nothing matches this filter.</div>';
}

/* ───── bugs ───── */
function renderBugs(){
  var m=el("main");m.className="";m.innerHTML='<div class="panecol" id="bugcol"><div class="empty">Loading bugs…</div></div>';
  api("/bugs").then(function(r){
    var col=el("bugcol");
    var add='<div class="addbox">'+
      '<input id="bugTitle" placeholder="Bug title (what\'s broken)">'+
      '<textarea id="bugBody" placeholder="Details — steps, who reported it, what should happen"></textarea>'+
      '<div class="frow"><input id="bugReporter" placeholder="reporter (optional)" style="flex:1">'+
      '<select id="bugSev"><option value="normal">normal</option><option value="high">high</option><option value="low">low</option></select></div>'+
      '<button class="addbtn" id="bugAdd">Log bug</button></div>';
    var bugs=(r.bugs||[]).map(bugCard).join("")||'<div class="empty">No bugs logged yet.</div>';
    col.innerHTML=add+bugs;
    el("bugAdd").onclick=function(){
      var t=el("bugTitle").value.trim();if(!t){toast("title required",true);return;}
      api("/bugs",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
        title:t,body:el("bugBody").value,reporter:el("bugReporter").value,severity:el("bugSev").value})})
        .then(function(x){if(!x.ok)throw new Error(x.error);toast("Bug logged ✓");renderBugs();})
        .catch(function(e){toast(e.message,true);});
    };
    wireBugs();
  });
}
function bugCard(b){
  var done=(b.status==="done"||b.status==="wontfix");
  var sev=b.severity==="high"?"high":(b.severity==="low"?"low":"");
  var comments=(b.comments||[]).map(function(c){return '<div class="cm">'+esc(c.body)+'<div class="who">'+esc(c.author||"")+" · "+fmtTs(c.ts)+'</div></div>';}).join("");
  var opts=["open","in_progress","blocked","done","wontfix"].map(function(s){return '<option value="'+s+'"'+(b.status===s?' selected':'')+'>'+s+'</option>';}).join("");
  return '<div class="bug'+(done?" done":"")+'" data-bug="'+b.id+'">'+
    '<div class="bh"><span class="bt">#'+b.id+' '+esc(b.title)+'</span>'+
      '<span><span class="sev '+sev+'">'+esc(b.severity||"normal")+'</span> <select class="bstatus">'+opts+'</select></span></div>'+
    (b.body?'<div class="bb">'+esc(b.body)+'</div>':'')+
    '<div class="cmeta" style="color:var(--dim);font-size:10.5px">'+(b.reporter?'reported by '+esc(b.reporter)+' · ':'')+'opened '+fmtTs(b.created_ts)+'</div>'+
    '<div class="comments">'+comments+
      '<div class="frow" style="display:flex;gap:6px;margin-top:4px"><input class="bcomment" placeholder="add a comment / update…" style="flex:1;background:#0e1219;border:1px solid var(--line);color:var(--txt);border-radius:7px;padding:7px 9px">'+
      '<button class="addbtn bcadd" style="padding:7px 14px">Add</button></div>'+
    '</div></div>';
}
function wireBugs(){
  Array.prototype.forEach.call(document.querySelectorAll(".bug"),function(d){
    var id=d.getAttribute("data-bug");
    d.querySelector(".bstatus").onchange=function(e){
      api("/bugs/"+id,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({status:e.target.value})})
        .then(function(){toast("status updated");renderBugs();});
    };
    d.querySelector(".bcadd").onclick=function(){
      var inp=d.querySelector(".bcomment"),v=inp.value.trim();if(!v)return;
      api("/bugs/"+id,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({comment:v})})
        .then(function(){toast("comment added");renderBugs();});
    };
  });
}

/* ───── worklog ───── */
function renderWorklog(){
  var m=el("main");m.className="";m.innerHTML='<div class="panecol" id="wlcol"><div class="empty">Loading worklog…</div></div>';
  api("/worklog").then(function(r){
    var col=el("wlcol");
    var add='<div class="addbox"><textarea id="wlEntry" placeholder="What changed / what you did / a note…"></textarea>'+
      '<div class="frow"><input id="wlTags" placeholder="tags (comma sep, optional)" style="flex:1"><input id="wlAuthor" placeholder="who (optional)" style="flex:1"></div>'+
      '<button class="addbtn" id="wlAdd">Add entry</button></div>';
    var feed=(r.worklog||[]).map(function(w){
      return '<div class="wl"><div>'+esc(w.entry).replace(/\n/g,"<br>")+'</div>'+
        '<div class="when">'+fmtTs(w.ts)+(w.author?' · '+esc(w.author):'')+(w.tags?' · <span class="tags">'+esc(w.tags)+'</span>':'')+'</div></div>';
    }).join("")||'<div class="empty">No worklog entries yet.</div>';
    col.innerHTML=add+feed;
    el("wlAdd").onclick=function(){
      var e=el("wlEntry").value.trim();if(!e){toast("entry required",true);return;}
      api("/worklog",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
        entry:e,tags:el("wlTags").value,author:el("wlAuthor").value})})
        .then(function(x){if(!x.ok)throw new Error(x.error);toast("Logged ✓");renderWorklog();})
        .catch(function(err){toast(err.message,true);});
    };
  });
}

/* ───── similarity / uniqueness ───── */
function renderSimilarity(){
  var m=el("main");m.className="";m.innerHTML='<div id="simwrap"><div class="empty">Loading similarity index…</div></div>';
  api("/similarity").then(function(r){
    var w=el("simwrap");
    if(!r.ok||!r.baked){ w.innerHTML='<div class="empty">'+esc((r&&r.error)||"Similarity index not built.")+'<br><br>Bake it with <code>python scripts/spb_catalog_fingerprint.py</code>, then reload. (It curates the whole catalog so this tab is instant.)</div>'; return; }
    var items=r.items||{}, ids=Object.keys(items);
    if(state.simThresh==null) state.simThresh=0.80;
    function draw(){
      var th=state.simThresh;
      var rows=ids.filter(function(id){var it=items[id];return !it.solid && (it.max_sim||0)>=th;})
                  .sort(function(a,b){return (items[b].max_sim||0)-(items[a].max_sim||0);});
      var head='<div class="filters" style="align-items:center">'+
        '<label style="color:var(--dim)">Hard line at <b style="color:var(--gold)" id="simval">'+Math.round(th*100)+'%</b></label>'+
        '<input type="range" min="50" max="100" value="'+Math.round(th*100)+'" style="flex:1;max-width:380px;accent-color:var(--gold)" id="simslider">'+
        '<span class="stat"><b>'+rows.length+'</b> finishes are ≥'+Math.round(th*100)+'% similar to another (the redo worklist) · '+ids.length+' indexed</span></div>'+
        '<div class="lead" style="margin:0 0 12px">Anything here is too close to another finish in the <b>whole catalog</b> (color-independent — recolors count). Drag the slider to your tolerance. Empty = clean.</div>';
      var body=rows.length? '<div class="grid">'+rows.map(function(id){var it=items[id];var nb=(it.neighbors&&it.neighbors[0])||{};
        return '<div class="card edited"><img class="sw" loading="lazy" src="'+API+'/swatch/'+encodeURIComponent(it.kind)+'/'+encodeURIComponent(id)+'?size=416" alt="'+esc(id)+'">'+
          '<div class="cbody"><div class="crow"><span class="cname">'+esc(it.name||id)+'</span><span class="pill ed">'+Math.round((it.max_sim||0)*100)+'% dup</span></div>'+
          '<div class="cid">'+esc(id)+' · '+esc(it.category||"")+'</div>'+
          '<div class="cmeta">nearest twin: <b>'+esc(nb.id||"?")+'</b> ['+esc(nb.category||"")+'] '+Math.round((nb.sim||0)*100)+'%'+(it.trace!=null?' · spec-traces-paint '+Math.round((it.trace||0)*100)+'%':'')+'</div>'+
        '</div></div>';}).join("")+'</div>'
        : '<div class="empty">Nothing is ≥'+Math.round(th*100)+'% similar to another finish. Clean at this threshold. 🎉</div>';
      w.innerHTML=head+body;
      var sl=el("simslider"); sl.addEventListener("input",function(){state.simThresh=parseInt(sl.value,10)/100;draw();});
    }
    draw();
  });
}

function route(){
  renderTabs();
  if(state.active==="similarity"){renderSimilarity();return;}
  if(state.active==="bugs"){renderBugs();return;}
  if(state.active==="worklog"){renderWorklog();return;}
  if(!state.cat){el("main").innerHTML='<div class="empty">Loading…</div>';return;}
  state.filter.group="";
  renderCatalogTab();
}

function boot(){
  renderTabs();
  api("/catalog").then(function(r){
    if(!r.ok)throw new Error(r.error||"catalog failed");
    state.cat=r;renderTabs();renderStat();route();
  }).catch(function(e){
    el("main").innerHTML='<div class="empty">Could not load the catalog: '+esc(e.message)+'<br><br>Open this page through the running SPB app (the local server must be up).</div>';
  });
}
boot();
})();
</script>
</body></html>
