<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 536" width="640" height="536" role="img" aria-labelledby="t d"><title id="t">Metal x roughness map</title><desc id="d">A plot with metallic up the side and roughness along the bottom. Chrome sits top left at 255 and 2, gloss bottom left, soft matte bottom right, with brushed, metallic, satin chrome and pearl between. A hatched strip marks the roughness-under-15 no-go zone.</desc><defs><pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#1c0b13"/><line x1="0" y1="0" x2="0" y2="7" stroke="#ff2e63" stroke-width="2.5"/></pattern></defs><rect width="640" height="536" fill="#0b0e17"/><text x="16.0" y="30.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="20" fill="#eef2f9" text-anchor="start" font-weight="700" >Metal x roughness: where real finishes live</text><text x="16.0" y="52.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#8794ad" text-anchor="start" >Every material is a point on this map. Gloss paint and chrome are opposite corners.</text><rect x="74.0" y="85.3" width="538.0" height="330.0" rx="0" fill="#080a12" stroke="#2a3150" stroke-width="1.2" /><rect x="74.0" y="85.3" width="538.0" height="19.4" rx="0" fill="#13261e" /><rect x="74.0" y="106.0" width="31.6" height="309.3" rx="0" fill="url(#hatch2)" stroke="#ff2e63" stroke-width="1" /><line x1="74.0" y1="415.3" x2="74.0" y2="421.3" stroke="#8794ad" stroke-width="1.5" /><text x="74.0" y="437.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="middle" font-weight="700" >0</text><line x1="68.0" y1="415.3" x2="74.0" y2="415.3" stroke="#8794ad" stroke-width="1.5" /><text x="64.0" y="420.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="end" font-weight="700" >0</text><line x1="209.0" y1="415.3" x2="209.0" y2="421.3" stroke="#8794ad" stroke-width="1.5" /><text x="209.0" y="437.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="middle" font-weight="700" >64</text><line x1="68.0" y1="332.5" x2="74.0" y2="332.5" stroke="#8794ad" stroke-width="1.5" /><text x="64.0" y="337.5" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="end" font-weight="700" >64</text><line x1="209.0" y1="85.3" x2="209.0" y2="415.3" stroke="#1b2133" stroke-width="1" /><line x1="74.0" y1="332.5" x2="612.0" y2="332.5" stroke="#1b2133" stroke-width="1" /><line x1="344.1" y1="415.3" x2="344.1" y2="421.3" stroke="#8794ad" stroke-width="1.5" /><text x="344.1" y="437.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="middle" font-weight="700" >128</text><line x1="68.0" y1="249.7" x2="74.0" y2="249.7" stroke="#8794ad" stroke-width="1.5" /><text x="64.0" y="254.7" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="end" font-weight="700" >128</text><line x1="344.1" y1="85.3" x2="344.1" y2="415.3" stroke="#1b2133" stroke-width="1" /><line x1="74.0" y1="249.7" x2="612.0" y2="249.7" stroke="#1b2133" stroke-width="1" /><line x1="479.1" y1="415.3" x2="479.1" y2="421.3" stroke="#8794ad" stroke-width="1.5" /><text x="479.1" y="437.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="middle" font-weight="700" >192</text><line x1="68.0" y1="166.8" x2="74.0" y2="166.8" stroke="#8794ad" stroke-width="1.5" /><text x="64.0" y="171.8" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="end" font-weight="700" >192</text><line x1="479.1" y1="85.3" x2="479.1" y2="415.3" stroke="#1b2133" stroke-width="1" /><line x1="74.0" y1="166.8" x2="612.0" y2="166.8" stroke="#1b2133" stroke-width="1" /><line x1="612.0" y1="415.3" x2="612.0" y2="421.3" stroke="#8794ad" stroke-width="1.5" /><text x="612.0" y="437.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="middle" font-weight="700" >255</text><line x1="68.0" y1="85.3" x2="74.0" y2="85.3" stroke="#8794ad" stroke-width="1.5" /><text x="64.0" y="90.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="end" font-weight="700" >255</text><text x="343.0" y="459.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#43d68a" text-anchor="middle" font-weight="700" >G Roughness  (mirror  &lt;-  0 ... 255  -&gt;  matte)</text><text transform="translate(18,250) rotate(-90)" text-anchor="middle" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#ff5d6c">R Metallic  (paint -> metal)</text><circle cx="78.2" cy="85.3" r="7" fill="#ffaa00" stroke="#0b0e17" stroke-width="2" /><text x="90.2" y="79.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#eef2f9" text-anchor="start" font-weight="700" >Chrome</text><circle cx="168.9" cy="91.8" r="7" fill="#ffaa00" stroke="#0b0e17" stroke-width="2" /><text x="180.9" y="115.8" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#eef2f9" text-anchor="start" font-weight="700" >Satin chrome</text><circle cx="179.5" cy="156.5" r="7" fill="#ffaa00" stroke="#0b0e17" stroke-width="2" /><text x="191.5" y="165.5" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#eef2f9" text-anchor="start" font-weight="700" >Metallic</text><circle cx="232.2" cy="182.4" r="7" fill="#ffaa00" stroke="#0b0e17" stroke-width="2" /><text x="244.2" y="191.4" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#eef2f9" text-anchor="start" font-weight="700" >Brushed</text><circle cx="158.4" cy="285.9" r="7" fill="#ffaa00" stroke="#0b0e17" stroke-width="2" /><text x="170.4" y="294.9" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#eef2f9" text-anchor="start" font-weight="700" >Pearl</text><circle cx="137.3" cy="415.3" r="7" fill="#ffaa00" stroke="#0b0e17" stroke-width="2" /><text x="147.3" y="403.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#eef2f9" text-anchor="start" font-weight="700" >Gloss</text><circle cx="274.4" cy="415.3" r="7" fill="#ffaa00" stroke="#0b0e17" stroke-width="2" /><text x="284.4" y="403.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#eef2f9" text-anchor="start" font-weight="700" >Satin</text><circle cx="496.0" cy="415.3" r="7" fill="#ffaa00" stroke="#0b0e17" stroke-width="2" /><text x="486.0" y="403.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#eef2f9" text-anchor="end" font-weight="700" >Soft matte</text><text x="114.0" y="121.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="start" font-style="italic" >mirror metal</text><text x="604.0" y="121.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="end" font-style="italic" >rough metal</text><text x="114.0" y="345.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="start" font-style="italic" >wet gloss paint</text><text x="604.0" y="407.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="end" font-style="italic" >flat matte paint</text><rect x="16.0" y="477.3" width="16.0" height="16.0" rx="0" fill="url(#hatch2)" stroke="#ff2e63" stroke-width="1" /><text x="40.0" y="490.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#c3ccdd" text-anchor="start" >Not allowed: roughness under 15 on anything below metal 240</text><rect x="16.0" y="501.3" width="16.0" height="16.0" rx="0" fill="#13261e" stroke="#2a3150" stroke-width="1" /><text x="40.0" y="514.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#c3ccdd" text-anchor="start" >Mirror metals (metal 240 or more) may go all the way to roughness 0</text></svg>
