<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 644" width="640" height="644" role="img" aria-labelledby="t d"><title id="t">Base, monolithic, pattern, spec pattern</title><desc id="d">Four cards. Base changes colour and shine. Monolithic changes both. Pattern changes colour and shine only a little. Spec pattern changes shine only. A note about second to fifth base overlays.</desc><rect width="640" height="644" fill="#0b0e17"/><text x="16.0" y="30.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="20" fill="#eef2f9" text-anchor="start" font-weight="700" >Four kinds of look: what each one changes</text><text x="16.0" y="52.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#8794ad" text-anchor="start" >Colour is what you see. Shine is how it reflects. Pick the kind that changes what you</text><text x="16.0" y="71.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#8794ad" text-anchor="start" >want.</text><rect x="14.0" y="96.6" width="300.0" height="214.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="14.0" y="104.6" width="4.0" height="198.0" rx="2" fill="#f5761a" /><text x="32.0" y="126.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="18" fill="#f5761a" text-anchor="start" font-weight="700" >BASE</text><text x="32.0" y="150.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13.5" fill="#c3ccdd" text-anchor="start" >A plain material: gloss, matte, satin,</text><text x="32.0" y="169.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13.5" fill="#c3ccdd" text-anchor="start" >chrome, candy, pearl, metallic,</text><text x="32.0" y="187.9" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13.5" fill="#c3ccdd" text-anchor="start" >carbon. The colour comes from the</text><text x="32.0" y="206.5" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13.5" fill="#c3ccdd" text-anchor="start" >zone's colour mode.</text><text x="32.0" y="256.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="start" font-weight="700" >Changes colour</text><circle cx="182.0" cy="252.6" r="8" fill="#f5761a" stroke="#f5761a" stroke-width="2" /><circle cx="208.0" cy="252.6" r="8" fill="#f5761a" stroke="#f5761a" stroke-width="2" /><text x="246.0" y="256.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#eef2f9" text-anchor="start" font-weight="700" >yes</text><text x="32.0" y="282.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="start" font-weight="700" >Changes shine</text><circle cx="182.0" cy="278.6" r="8" fill="#f5761a" stroke="#f5761a" stroke-width="2" /><circle cx="208.0" cy="278.6" r="8" fill="#f5761a" stroke="#f5761a" stroke-width="2" /><text x="246.0" y="282.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#eef2f9" text-anchor="start" font-weight="700" >yes</text><rect x="326.0" y="96.6" width="300.0" height="214.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="326.0" y="104.6" width="4.0" height="198.0" rx="2" fill="#ff3366" /><text x="344.0" y="126.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="18" fill="#ff3366" text-anchor="start" font-weight="700" >MONOLITHIC</text><text x="344.0" y="150.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13.5" fill="#c3ccdd" text-anchor="start" >A complete special look that brings</text><text x="344.0" y="169.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13.5" fill="#c3ccdd" text-anchor="start" >its own colour and texture. Use it for</text><text x="344.0" y="187.9" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13.5" fill="#c3ccdd" text-anchor="start" >a whole effect like galaxy or</text><text x="344.0" y="206.5" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13.5" fill="#c3ccdd" text-anchor="start" >hologram.</text><text x="344.0" y="256.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="start" font-weight="700" >Changes colour</text><circle cx="494.0" cy="252.6" r="8" fill="#ff3366" stroke="#ff3366" stroke-width="2" /><circle cx="520.0" cy="252.6" r="8" fill="#ff3366" stroke="#ff3366" stroke-width="2" /><text x="558.0" y="256.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#eef2f9" text-anchor="start" font-weight="700" >yes</text><text x="344.0" y="282.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="start" font-weight="700" >Changes shine</text><circle cx="494.0" cy="278.6" r="8" fill="#ff3366" stroke="#ff3366" stroke-width="2" /><circle cx="520.0" cy="278.6" r="8" fill="#ff3366" stroke="#ff3366" stroke-width="2" /><text x="558.0" y="282.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#eef2f9" text-anchor="start" font-weight="700" >yes</text><rect x="14.0" y="322.6" width="300.0" height="214.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="14.0" y="330.6" width="4.0" height="198.0" rx="2" fill="#00e5ff" /><text x="32.0" y="352.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="18" fill="#00e5ff" text-anchor="start" font-weight="700" >PATTERN</text><text x="32.0" y="376.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13.5" fill="#c3ccdd" text-anchor="start" >A visible pattern on top of the base:</text><text x="32.0" y="395.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13.5" fill="#c3ccdd" text-anchor="start" >carbon weave, camo, stripes, flames.</text><text x="32.0" y="413.9" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13.5" fill="#c3ccdd" text-anchor="start" >Its spec amount starts at 0, so your</text><text x="32.0" y="432.5" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13.5" fill="#c3ccdd" text-anchor="start" >base shine stays.</text><text x="32.0" y="482.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="start" font-weight="700" >Changes colour</text><circle cx="182.0" cy="478.6" r="8" fill="#00e5ff" stroke="#00e5ff" stroke-width="2" /><circle cx="208.0" cy="478.6" r="8" fill="#00e5ff" stroke="#00e5ff" stroke-width="2" /><text x="246.0" y="482.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#eef2f9" text-anchor="start" font-weight="700" >yes</text><text x="32.0" y="508.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="start" font-weight="700" >Changes shine</text><circle cx="182.0" cy="504.6" r="8" fill="#00e5ff" stroke="#00e5ff" stroke-width="2" /><circle cx="208.0" cy="504.6" r="8" fill="none" stroke="#00e5ff" stroke-width="2" /><text x="246.0" y="508.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#eef2f9" text-anchor="start" font-weight="700" >a little</text><rect x="326.0" y="322.6" width="300.0" height="214.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="326.0" y="330.6" width="4.0" height="198.0" rx="2" fill="#4cc38a" /><text x="344.0" y="352.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="18" fill="#4cc38a" text-anchor="start" font-weight="700" >SPEC PATTERN</text><text x="344.0" y="376.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13.5" fill="#c3ccdd" text-anchor="start" >A texture for shine only: flake,</text><text x="344.0" y="395.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13.5" fill="#c3ccdd" text-anchor="start" >sparkle, engine-turn, weave. The</text><text x="344.0" y="413.9" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13.5" fill="#c3ccdd" text-anchor="start" >colour does not change. Up to 5 can</text><text x="344.0" y="432.5" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13.5" fill="#c3ccdd" text-anchor="start" >stack.</text><text x="344.0" y="482.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="start" font-weight="700" >Changes colour</text><circle cx="494.0" cy="478.6" r="8" fill="none" stroke="#4cc38a" stroke-width="2" /><circle cx="520.0" cy="478.6" r="8" fill="none" stroke="#4cc38a" stroke-width="2" /><text x="558.0" y="482.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#5b667e" text-anchor="start" font-weight="700" >no</text><text x="344.0" y="508.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="start" font-weight="700" >Changes shine</text><circle cx="494.0" cy="504.6" r="8" fill="#4cc38a" stroke="#4cc38a" stroke-width="2" /><circle cx="520.0" cy="504.6" r="8" fill="#4cc38a" stroke="#4cc38a" stroke-width="2" /><text x="558.0" y="508.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#eef2f9" text-anchor="start" font-weight="700" >yes</text><rect x="14.0" y="560.6" width="612.0" height="66.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="14.0" y="568.6" width="4.0" height="50.0" rx="2" fill="#ffaa00" /><text x="32.0" y="588.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#c3ccdd" text-anchor="start" >A zone can also blend a second to fifth base over the first (OVERLAYS), for</text><text x="32.0" y="608.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#c3ccdd" text-anchor="start" >example a gloss body with a pearl layer at 40%.</text></svg>
