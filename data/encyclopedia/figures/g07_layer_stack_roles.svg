<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 557" width="640" height="557" role="img" aria-labelledby="t d"><title id="t">Template layers and their jobs</title><desc id="d">A layer list. The group Turn Off Before Exporting TGA holds Wire, Mask and Car_Mandatory, all with the eye off. Numbers, Sponsors and Car Paint have the eye on. Notes explain guides off, art on.</desc><rect width="640" height="557" fill="#0b0e17"/><text x="16.0" y="30.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="20" fill="#eef2f9" text-anchor="start" font-weight="700" >Your template's layers and what they do</text><text x="16.0" y="52.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#8794ad" text-anchor="start" >Layer names vary by car. The jobs are always the same.</text><rect x="14.0" y="77.3" width="330.0" height="372.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><text x="28.0" y="101.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="start" font-weight="700" >LAYERS</text><rect x="22.0" y="113.3" width="314.0" height="38.0" rx="6" fill="#1a1426" stroke="#2a3150" stroke-width="1" /><circle cx="38.0" cy="132.3" r="9" fill="none" stroke="#4cc38a" stroke-width="2" /><circle cx="38.0" cy="132.3" r="3.5" fill="#4cc38a" /><text x="60.0" y="138.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#eef2f9" text-anchor="start" font-weight="700" >Turn Off Before Exporting TGA</text><text x="320.0" y="138.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="end" >group</text><rect x="22.0" y="157.3" width="314.0" height="38.0" rx="6" fill="#171c2e" stroke="#2a3150" stroke-width="1" /><circle cx="38.0" cy="176.3" r="9" fill="none" stroke="#5b667e" stroke-width="2" /><line x1="30.0" y1="184.3" x2="46.0" y2="168.3" stroke="#ff2e63" stroke-width="2" /><text x="84.0" y="182.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#8794ad" text-anchor="start" >Wire</text><rect x="22.0" y="201.3" width="314.0" height="38.0" rx="6" fill="#171c2e" stroke="#2a3150" stroke-width="1" /><circle cx="38.0" cy="220.3" r="9" fill="none" stroke="#5b667e" stroke-width="2" /><line x1="30.0" y1="228.3" x2="46.0" y2="212.3" stroke="#ff2e63" stroke-width="2" /><text x="84.0" y="226.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#8794ad" text-anchor="start" >Mask</text><rect x="22.0" y="245.3" width="314.0" height="38.0" rx="6" fill="#171c2e" stroke="#2a3150" stroke-width="1" /><circle cx="38.0" cy="264.3" r="9" fill="none" stroke="#5b667e" stroke-width="2" /><line x1="30.0" y1="272.3" x2="46.0" y2="256.3" stroke="#ff2e63" stroke-width="2" /><text x="84.0" y="270.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#8794ad" text-anchor="start" >Car_Mandatory</text><rect x="22.0" y="295.3" width="314.0" height="38.0" rx="6" fill="#171c2e" stroke="#2a3150" stroke-width="1" /><circle cx="38.0" cy="314.3" r="9" fill="none" stroke="#4cc38a" stroke-width="2" /><circle cx="38.0" cy="314.3" r="3.5" fill="#4cc38a" /><text x="60.0" y="320.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#eef2f9" text-anchor="start" >Numbers</text><rect x="22.0" y="339.3" width="314.0" height="38.0" rx="6" fill="#171c2e" stroke="#2a3150" stroke-width="1" /><circle cx="38.0" cy="358.3" r="9" fill="none" stroke="#4cc38a" stroke-width="2" /><circle cx="38.0" cy="358.3" r="3.5" fill="#4cc38a" /><text x="60.0" y="364.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#eef2f9" text-anchor="start" >Sponsors</text><rect x="22.0" y="383.3" width="314.0" height="38.0" rx="6" fill="#171c2e" stroke="#2a3150" stroke-width="1" /><circle cx="38.0" cy="402.3" r="9" fill="none" stroke="#4cc38a" stroke-width="2" /><circle cx="38.0" cy="402.3" r="3.5" fill="#4cc38a" /><text x="60.0" y="408.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#eef2f9" text-anchor="start" >Car Paint</text><text x="28.0" y="439.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="start" font-style="italic" >top layers cover the ones under them</text><line x1="344.0" y1="135.3" x2="358.0" y2="135.3" stroke="#ff2e63" stroke-width="2" /><text x="364.0" y="129.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="15" fill="#ff2e63" text-anchor="start" font-weight="700" >Guides: switch OFF</text><text x="364.0" y="151.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#c3ccdd" text-anchor="start" >Wire draws the panel outlines, Mask</text><text x="364.0" y="169.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#c3ccdd" text-anchor="start" >marks the paintable area, Car_Mandatory</text><text x="364.0" y="187.2" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#c3ccdd" text-anchor="start" >is the template's own guide.</text><text x="364.0" y="207.1" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#ff2e63" text-anchor="start" >Left on, they are baked into your</text><text x="364.0" y="225.1" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#ff2e63" text-anchor="start" >paint: grid lines and grey masks on the</text><text x="364.0" y="243.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#ff2e63" text-anchor="start" >car.</text><line x1="344.0" y1="317.3" x2="358.0" y2="317.3" stroke="#4cc38a" stroke-width="2" /><text x="364.0" y="311.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="15" fill="#4cc38a" text-anchor="start" font-weight="700" >Your art: keep ON</text><text x="364.0" y="333.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#c3ccdd" text-anchor="start" >These carry your paint, numbers and</text><text x="364.0" y="351.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#c3ccdd" text-anchor="start" >sponsors. Eye = show / hide.</text><text x="364.0" y="371.2" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="start" >A zone can be limited to one of them</text><text x="364.0" y="389.1" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="start" >(RESTRICT TO LAYERS).</text><rect x="14.0" y="465.3" width="612.0" height="74.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="14.0" y="473.3" width="4.0" height="58.0" rx="2" fill="#f5761a" /><text x="32.0" y="493.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#c3ccdd" text-anchor="start" >Switch the guide layers off before you press RENDER, or they are painted into</text><text x="32.0" y="512.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#c3ccdd" text-anchor="start" >your car. One click on the eye of the group does it.</text></svg>
