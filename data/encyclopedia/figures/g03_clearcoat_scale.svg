<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 435" width="640" height="435" role="img" aria-labelledby="t d"><title id="t">Clearcoat scale (backwards)</title><desc id="d">A bar from 0 to 255. 0 is no coat, 1 to 15 is hatched red as never use, 16 is marked MAX GLOSS and 17 to 255 fades to dull. Gloss is 16, satin 70, soft matte 165 (catalogue values).</desc><defs><linearGradient id="cg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7fa6ff"/><stop offset="1" stop-color="#1a2038"/></linearGradient><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#2a0d17"/><line x1="0" y1="0" x2="0" y2="7" stroke="#ff2e63" stroke-width="3"/></pattern></defs><rect width="640" height="435" fill="#0b0e17"/><text x="16.0" y="30.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="20" fill="#eef2f9" text-anchor="start" font-weight="700" >B = Clearcoat is backwards</text><text x="16.0" y="52.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#8794ad" text-anchor="start" >A smaller number is a glossier coat. 16 is the best you can ask for.</text><rect x="66.4" y="173.3" width="543.6" height="28.0" rx="0" fill="url(#cg)" stroke="#2a3150" stroke-width="1" /><rect x="32.3" y="173.3" width="34.1" height="28.0" rx="0" fill="url(#hatch)" stroke="#ff2e63" stroke-width="1" /><rect x="28.0" y="173.3" width="4.0" height="28.0" rx="0" fill="#c3ccdd" /><rect x="64.9" y="169.3" width="3.0" height="36.0" rx="0" fill="#ffaa00" /><line x1="30.0" y1="89.3" x2="30.0" y2="173.3" stroke="#c3ccdd" stroke-width="1.5" /><text x="38.0" y="91.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#c3ccdd" text-anchor="start" >0 = no coat at all (valid)</text><line x1="48.2" y1="117.3" x2="48.2" y2="173.3" stroke="#ff2e63" stroke-width="1.5" /><text x="56.2" y="119.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#ff2e63" text-anchor="start" font-weight="700" >1 to 15 = never use</text><line x1="66.4" y1="143.3" x2="66.4" y2="169.3" stroke="#ffaa00" stroke-width="1.5" /><text x="74.4" y="145.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="15" fill="#ffaa00" text-anchor="start" font-weight="700" >16 = MAX GLOSS</text><circle cx="66.4" cy="187.3" r="5" fill="#ffaa00" stroke="#0b0e17" stroke-width="2" /><text x="66.4" y="225.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#eef2f9" text-anchor="middle" font-weight="700" >Gloss</text><text x="66.4" y="243.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#5b8cff" text-anchor="middle" font-weight="700" >CC 16</text><circle cx="189.2" cy="187.3" r="5" fill="#5b8cff" stroke="#0b0e17" stroke-width="2" /><text x="189.2" y="225.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#eef2f9" text-anchor="middle" font-weight="700" >Satin</text><text x="189.2" y="243.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#5b8cff" text-anchor="middle" font-weight="700" >CC 70</text><circle cx="405.3" cy="187.3" r="5" fill="#5b8cff" stroke="#0b0e17" stroke-width="2" /><text x="405.3" y="225.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#eef2f9" text-anchor="middle" font-weight="700" >Soft matte</text><text x="405.3" y="243.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#5b8cff" text-anchor="middle" font-weight="700" >CC 165</text><line x1="84.6" y1="271.3" x2="606.0" y2="271.3" stroke="#8794ad" stroke-width="2" /><polygon points="606.0,271.3 597.9,275.2 597.9,267.4" fill="#8794ad"/><text x="84.6" y="293.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#8794ad" text-anchor="start" >bigger number = less gloss</text><text x="610.0" y="293.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#8794ad" text-anchor="end" font-weight="700" >255 = dull</text><rect x="14.0" y="317.3" width="612.0" height="100.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="14.0" y="325.3" width="4.0" height="84.0" rx="2" fill="#ff2e63" /><text x="32.0" y="345.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="16" fill="#eef2f9" text-anchor="start" font-weight="700" >Iron rule</text><text x="32.0" y="367.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#c3ccdd" text-anchor="start" >Anywhere there is paint, clearcoat must be 16 or more, or exactly 0. Values 1 to</text><text x="32.0" y="386.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#c3ccdd" text-anchor="start" >15 blow out to white in iRacing, so Shokker raises them to 16.</text></svg>
