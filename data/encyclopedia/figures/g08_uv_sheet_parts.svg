<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 812" width="640" height="812" role="img" aria-labelledby="t d"><title id="t">The car laid flat</title><desc id="d">A square sheet with eight labelled boxes: front bumper, rear bumper, spoiler, right side, left side, hood, roof and trunk, with arrows showing which way the front faces.</desc><rect width="640" height="812" fill="#0b0e17"/><text x="16.0" y="30.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="20" fill="#eef2f9" text-anchor="start" font-weight="700" >The car cut open: one flat 2048 x 2048 sheet</text><text x="16.0" y="52.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#8794ad" text-anchor="start" >Every part of the car lies flat on one picture. Example: NASCAR Next Gen 2024</text><text x="16.0" y="71.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#8794ad" text-anchor="start" >template.</text><rect x="40.0" y="102.6" width="560.0" height="560.0" rx="0" fill="#080a12" stroke="#2a3150" stroke-width="1.5" /><rect x="45.6" y="102.6" width="263.2" height="117.6" rx="4" fill="#00e5ff" stroke="#00e5ff" stroke-width="1.5" fill-opacity="0.22"/><text x="177.2" y="166.4" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#eef2f9" text-anchor="middle" font-weight="700" >FRONT BUMPER</text><rect x="325.6" y="102.6" width="218.4" height="117.6" rx="4" fill="#3366ff" stroke="#3366ff" stroke-width="1.5" fill-opacity="0.22"/><text x="434.8" y="166.4" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#eef2f9" text-anchor="middle" font-weight="700" >REAR BUMPER</text><rect x="532.8" y="102.6" width="61.6" height="179.2" rx="4" fill="#ff3366" stroke="#ff3366" stroke-width="1.5" fill-opacity="0.22"/><text x="563.6" y="197.2" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#eef2f9" text-anchor="middle" font-weight="700" >SPOILER</text><rect x="45.6" y="237.0" width="464.8" height="128.8" rx="4" fill="#f5761a" stroke="#f5761a" stroke-width="1.5" fill-opacity="0.22"/><text x="278.0" y="306.4" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#eef2f9" text-anchor="middle" font-weight="700" >RIGHT SIDE</text><line x1="53.6" y1="251.0" x2="83.6" y2="251.0" stroke="#f5761a" stroke-width="2" /><polygon points="83.6,251.0 75.5,255.0 75.5,247.1" fill="#f5761a"/><text x="89.6" y="256.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#f5761a" text-anchor="start" font-weight="700" >front</text><rect x="45.6" y="528.2" width="464.8" height="134.4" rx="4" fill="#ffaa00" stroke="#ffaa00" stroke-width="1.5" fill-opacity="0.22"/><text x="278.0" y="600.4" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#eef2f9" text-anchor="middle" font-weight="700" >LEFT SIDE</text><line x1="53.6" y1="542.2" x2="83.6" y2="542.2" stroke="#ffaa00" stroke-width="2" /><polygon points="83.6,542.2 75.5,546.2 75.5,538.3" fill="#ffaa00"/><text x="89.6" y="547.2" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#ffaa00" text-anchor="start" font-weight="700" >front</text><rect x="398.4" y="343.4" width="156.8" height="207.2" rx="4" fill="#4cc38a" stroke="#4cc38a" stroke-width="1.5" fill-opacity="0.22"/><text x="476.8" y="452.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#eef2f9" text-anchor="middle" font-weight="700" >HOOD</text><line x1="517.2" y1="357.4" x2="547.2" y2="357.4" stroke="#4cc38a" stroke-width="2" /><polygon points="547.2,357.4 539.1,361.4 539.1,353.5" fill="#4cc38a"/><text x="511.2" y="362.4" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#4cc38a" text-anchor="end" font-weight="700" >front</text><rect x="96.0" y="371.4" width="240.8" height="145.6" rx="4" fill="#b07cff" stroke="#b07cff" stroke-width="1.5" fill-opacity="0.22"/><text x="216.4" y="449.2" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#eef2f9" text-anchor="middle" font-weight="700" >ROOF</text><rect x="45.6" y="371.4" width="44.8" height="134.4" rx="4" fill="#ff7ab6" stroke="#ff7ab6" stroke-width="1.5" fill-opacity="0.22"/><text transform="translate(73.0,438.6) rotate(-90)" text-anchor="middle" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#eef2f9">TRUNK</text><text x="40.0" y="684.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="start" font-weight="700" >0</text><text x="600.0" y="684.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="end" font-weight="700" >2048 px</text><rect x="14.0" y="698.6" width="612.0" height="96.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="14.0" y="706.6" width="4.0" height="80.0" rx="2" fill="#f5761a" /><text x="32.0" y="726.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#c3ccdd" text-anchor="start" >Part positions differ per car template. Shokker knows the layout of each one, so</text><text x="32.0" y="746.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#c3ccdd" text-anchor="start" >you can say left side or hood and it lands on the right panel. Arrows show which</text><text x="32.0" y="765.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#c3ccdd" text-anchor="start" >way the front of the car points. On this template the right side is printed</text><text x="32.0" y="784.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#c3ccdd" text-anchor="start" >upside down.</text></svg>
