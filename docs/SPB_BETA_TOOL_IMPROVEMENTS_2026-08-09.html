:root[data-theme=&quot;light&quot;] {

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;

* {

}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */

    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))

    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))

  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans);
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {

  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);

  font-family: var(--font-mono);

}

.table-responsive {

  overflow-x: auto;

}

  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {

  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {

  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {

}

}

}

.table .text-nowrap {

}

  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {

  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),

  );

  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

  align-items: center;
  gap: 10px;
}

.viz-badge {

  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);

}

.text-muted {

}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;

}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;

  gap: 2px 12px;

.btn,

.btn:not(:disabled):hover {

  background: var(--foreground);

  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

      &lt;article class=&quot;spb-improvement&quot;&gt;
        &lt;div class=&quot;spb-number&quot;&gt;06&lt;/div&gt;
        &lt;div&gt;&lt;h3&gt;Dialogs no longer hide the artwork&lt;/h3&gt;&lt;p&gt;Adjustments, Layer Effects, and Flatten use readable in-app surfaces. SOURCE stays visible and blocking browser prompts are gone from these workflows.&lt;/p&gt;&lt;/div&gt;
      &lt;/article&gt;
      &lt;article class=&quot;spb-improvement&quot;&gt;
        &lt;div class=&quot;spb-number&quot;&gt;07&lt;/div&gt;
        &lt;div&gt;&lt;h3&gt;The options bar stays usable&lt;/h3&gt;&lt;p&gt;Controls remain in one fixed-height horizontal rail. They scroll instead of wrapping underneath SOURCE or becoming covered and unclickable.&lt;/p&gt;&lt;/div&gt;
      &lt;/article&gt;
      &lt;article class=&quot;spb-improvement&quot;&gt;
        &lt;div class=&quot;spb-number&quot;&gt;08&lt;/div&gt;
        &lt;div&gt;&lt;h3&gt;Heavy tools move far less data&lt;/h3&gt;&lt;p&gt;Retouch uploads only the changed rectangle, Layer dragging composites once per frame, and the expensive full readback waits until release.&lt;/p&gt;&lt;/div&gt;
      &lt;/article&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section aria-labelledby=&quot;spb-before-title&quot;&gt;
    &lt;div class=&quot;spb-section-head&quot;&gt;&lt;h2 id=&quot;spb-before-title&quot;&gt;The behavior shift&lt;/h2&gt;&lt;/div&gt;
    &lt;div class=&quot;spb-before-after&quot;&gt;
      &lt;div class=&quot;spb-state before&quot;&gt;
        &lt;h3&gt;Before&lt;/h3&gt;
        &lt;ul&gt;
          &lt;li&gt;A tool could highlight but edit the wrong authority—or nothing.&lt;/li&gt;
          &lt;li&gt;Alt could sample a color when the painter meant subtract.&lt;/li&gt;
          &lt;li&gt;Mask bytes changed while counters and LIVE PREVIEW stayed stale.&lt;/li&gt;
          &lt;li&gt;Cancel and preview could leak into History.&lt;/li&gt;
          &lt;li&gt;Wrapped options were visible but physically unclickable.&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/div&gt;
      &lt;div class=&quot;spb-arrow-label&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/div&gt;
      &lt;div class=&quot;spb-state after&quot;&gt;
        &lt;h3&gt;Now&lt;/h3&gt;
        &lt;ul&gt;
          &lt;li&gt;The current document and tool agree on Zone or Layer before arming.&lt;/li&gt;
          &lt;li&gt;Modifiers have one central owner and do what the label promises.&lt;/li&gt;
          &lt;li&gt;Mask, apply-area state, UI, overlay, and preview settle together.&lt;/li&gt;
          &lt;li&gt;Apply is one action; Cancel is zero; Undo/Redo round-trip.&lt;/li&gt;
          &lt;li&gt;Every tool option remains reachable without moving the canvases.&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;spb-lanes&quot; aria-label=&quot;Verified Zone and Layer tool families&quot;&gt;
    &lt;article class=&quot;spb-lane&quot;&gt;
      &lt;h3&gt;Flat image / Zone lane&lt;/h3&gt;
      &lt;p&gt;TGA, JPEG, PNG and BMP keep material/UV control through Zones and masks.&lt;/p&gt;
      &lt;div class=&quot;spb-chips&quot; aria-label=&quot;Zone tools verified&quot;&gt;
        &lt;span class=&quot;spb-chip&quot;&gt;Brush&lt;/span&gt;&lt;span class=&quot;spb-chip&quot;&gt;Eraser&lt;/span&gt;&lt;span class=&quot;spb-chip&quot;&gt;Wand&lt;/span&gt;&lt;span class=&quot;spb-chip&quot;&gt;Lasso&lt;/span&gt;&lt;span class=&quot;spb-chip&quot;&gt;Rectangle&lt;/span&gt;&lt;span class=&quot;spb-chip&quot;&gt;Ellipse&lt;/span&gt;&lt;span class=&quot;spb-chip&quot;&gt;Pen&lt;/span&gt;&lt;span class=&quot;spb-chip&quot;&gt;Smart Region&lt;/span&gt;&lt;span class=&quot;spb-chip&quot;&gt;Grab Object&lt;/span&gt;&lt;span class=&quot;spb-chip&quot;&gt;Mask refine&lt;/span&gt;&lt;span class=&quot;spb-chip&quot;&gt;Spec tools&lt;/span&gt;&lt;span class=&quot;spb-chip&quot;&gt;Zone transform&lt;/span&gt;
      &lt;/div&gt;
    &lt;/article&gt;
    &lt;article class=&quot;spb-lane layer&quot;&gt;
      &lt;h3&gt;PSD / GIMP-style Layer lane&lt;/h3&gt;
      &lt;p&gt;PSD, XCF and ORA keep real Layer pixels, order, opacity, effects, transforms and blend state.&lt;/p&gt;
      &lt;div class=&quot;spb-chips&quot; aria-label=&quot;Layer tools verified&quot;&gt;
        &lt;span class=&quot;spb-chip&quot;&gt;Brush&lt;/span&gt;&lt;span class=&quot;spb-chip&quot;&gt;Eraser&lt;/span&gt;&lt;span class=&quot;spb-chip&quot;&gt;Fill&lt;/span&gt;&lt;span class=&quot;spb-chip&quot;&gt;Color Brush&lt;/span&gt;&lt;span class=&quot;spb-chip&quot;&gt;Recolor&lt;/span&gt;&lt;span class=&quot;spb-chip&quot;&gt;Healing&lt;/span&gt;&lt;span class=&quot;spb-chip&quot;&gt;Smudge&lt;/span&gt;&lt;span class=&quot;spb-chip&quot;&gt;Burn&lt;/span&gt;&lt;span class=&quot;spb-chip&quot;&gt;Pick Item&lt;/span&gt;&lt;span class=&quot;spb-chip&quot;&gt;Transform&lt;/span&gt;&lt;span class=&quot;spb-chip&quot;&gt;Layer Effects&lt;/span&gt;&lt;span class=&quot;spb-chip&quot;&gt;8 Adjustments&lt;/span&gt;&lt;span class=&quot;spb-chip&quot;&gt;Opacity&lt;/span&gt;&lt;span class=&quot;spb-chip&quot;&gt;Order + rename&lt;/span&gt;
      &lt;/div&gt;
    &lt;/article&gt;
  &lt;/section&gt;

  &lt;section class=&quot;spb-proof&quot; aria-labelledby=&quot;spb-proof-title&quot;&gt;
    &lt;div&gt;
      &lt;div class=&quot;spb-section-head&quot;&gt;&lt;h2 id=&quot;spb-proof-title&quot;&gt;Why this is a sensible Beta boundary&lt;/h2&gt;&lt;/div&gt;
      &lt;ul class=&quot;spb-proof-list&quot;&gt;
        &lt;li&gt;&lt;strong&gt;Current wrap:&lt;/strong&gt; 25/25 modifier, sampled-selection, Wand, activation, and picker checks; 3/3 options-rail checks.&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;Family batteries:&lt;/strong&gt; 38/38 cross-format, 44/44 Zone selection/mask/placement, and 118/118 Layer paint/retouch/transform/adjust checks.&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;Live browser replay:&lt;/strong&gt; real flat and layered documents, real pointer gestures, exact Undo/Redo, and responsive 1280×720 + 1920×1080 option-rail hit testing.&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;Packaging:&lt;/strong&gt; all 1,542 runtime copy targets report zero drift.&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;Final Wand proof:&lt;/strong&gt; Replace 7,665 px → Alt-subtract empty → Undo 7,665/ON → Redo empty/OFF, with no color-sampling theft.&lt;/li&gt;
      &lt;/ul&gt;
    &lt;/div&gt;
    &lt;aside class=&quot;spb-protected&quot;&gt;
      &lt;h3&gt;Deliberately protected&lt;/h3&gt;
      &lt;p&gt;&lt;strong&gt;Pick Color sampling:&lt;/strong&gt; unchanged. The missing swatch/tolerance UI and wrong-Zone targeting were repaired around it.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Spatial Exclude:&lt;/strong&gt; unchanged. Central routing explicitly preserves its frozen behavior.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Main layout:&lt;/strong&gt; recognizable. The options rail and dialogs were repaired without redesigning the whole front end.&lt;/p&gt;
    &lt;/aside&gt;
  &lt;/section&gt;

  &lt;footer class=&quot;spb-footer&quot;&gt;
    &lt;span&gt;Release boundary: stop tool mutations here; owner Beta review comes next.&lt;/span&gt;
    &lt;span&gt;Prepared August 9, 2026&lt;/span&gt;
  &lt;/footer&gt;
&lt;/section&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
