<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 573" width="640" height="573" role="img" aria-labelledby="t d"><title id="t">Scale on the car</title><desc id="d">A sheet outline with the left side panel marked. An orange square shows a 256 pixel area and a small cyan square shows a 32 pixel detail, with a note about the scale slider.</desc><rect width="640" height="573" fill="#0b0e17"/><text x="16.0" y="30.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="20" fill="#eef2f9" text-anchor="start" font-weight="700" >Why finish detail must be tiny</text><text x="16.0" y="52.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#8794ad" text-anchor="start" >The 2048 px sheet covers the whole car. Small on the sheet is already big on the car.</text><rect x="20.0" y="83.3" width="360.0" height="360.0" rx="0" fill="#080a12" stroke="#2a3150" stroke-width="1.5" /><rect x="23.6" y="83.3" width="169.2" height="75.6" rx="3" fill="#1f2740" stroke="#2a3150" stroke-width="1" /><rect x="203.6" y="83.3" width="140.4" height="75.6" rx="3" fill="#1f2740" stroke="#2a3150" stroke-width="1" /><rect x="336.8" y="83.3" width="39.6" height="115.2" rx="3" fill="#1f2740" stroke="#2a3150" stroke-width="1" /><rect x="23.6" y="169.7" width="298.8" height="82.8" rx="3" fill="#1f2740" stroke="#2a3150" stroke-width="1" /><rect x="23.6" y="356.9" width="298.8" height="86.4" rx="3" fill="#1f2740" stroke="#2a3150" stroke-width="1" /><rect x="250.4" y="238.1" width="100.8" height="133.2" rx="3" fill="#1f2740" stroke="#2a3150" stroke-width="1" /><rect x="56.0" y="256.1" width="154.8" height="93.6" rx="3" fill="#1f2740" stroke="#2a3150" stroke-width="1" /><rect x="23.6" y="256.1" width="28.8" height="86.4" rx="3" fill="#1f2740" stroke="#2a3150" stroke-width="1" /><rect x="29.6" y="394.3" width="45.0" height="45.0" rx="0" fill="none" stroke="#f5761a" stroke-width="2" /><text x="52.1" y="421.8" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#f5761a" text-anchor="middle" font-weight="700" >256</text><rect x="96.6" y="429.7" width="5.6" height="5.6" rx="0" fill="#00e5ff" stroke="#00e5ff" stroke-width="1" /><line x1="105.2" y1="432.7" x2="122.2" y2="413.7" stroke="#00e5ff" stroke-width="1.5" /><text x="124.2" y="417.7" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#00e5ff" text-anchor="start" font-weight="700" >32</text><text x="27.6" y="350.9" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="start" font-weight="700" >left side panel</text><text x="200.0" y="463.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="middle" font-weight="700" >whole sheet = 2048 px</text><text x="400.0" y="107.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="16" fill="#eef2f9" text-anchor="start" font-weight="700" >Same sheet, two sizes</text><rect x="400.0" y="127.3" width="22.0" height="22.0" rx="0" fill="none" stroke="#f5761a" stroke-width="2" /><text x="432.0" y="139.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13.5" fill="#c3ccdd" text-anchor="start" >256 px: an eighth of the</text><text x="432.0" y="157.9" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13.5" fill="#c3ccdd" text-anchor="start" >sheet. A big blob on the car.</text><rect x="406.0" y="188.6" width="10.0" height="10.0" rx="0" fill="#00e5ff" stroke="#00e5ff" stroke-width="1" /><text x="432.0" y="197.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13.5" fill="#c3ccdd" text-anchor="start" >32 px: about the size of a</text><text x="432.0" y="216.2" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13.5" fill="#c3ccdd" text-anchor="start" >side mirror. Good fine detail</text><text x="432.0" y="234.8" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13.5" fill="#c3ccdd" text-anchor="start" >is 8 to 32 px.</text><rect x="394.0" y="265.5" width="232.0" height="118.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="394.0" y="273.5" width="4.0" height="102.0" rx="2" fill="#4cc38a" /><text x="412.0" y="291.5" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#eef2f9" text-anchor="start" font-weight="700" >In the zone editor</text><text x="412.0" y="311.5" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#c3ccdd" text-anchor="start" >Base Scale 0.5 = twice as</text><text x="412.0" y="329.4" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#c3ccdd" text-anchor="start" >fine. 0.05x to 5.0x. Smaller</text><text x="412.0" y="347.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#c3ccdd" text-anchor="start" >= finer, more repeats.</text><rect x="14.0" y="483.3" width="612.0" height="72.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="14.0" y="491.3" width="4.0" height="56.0" rx="2" fill="#f5761a" /><text x="32.0" y="511.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#c3ccdd" text-anchor="start" >When a texture looks like smeared paint on the car, make it finer: lower Base</text><text x="32.0" y="530.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#c3ccdd" text-anchor="start" >Scale or pattern Scale below 1.</text></svg>
