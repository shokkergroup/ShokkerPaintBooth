<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 515" width="640" height="515" role="img" aria-labelledby="t d"><title id="t">Foundation: only the shine changes</title><desc id="d">Three columns with an identical blue striped paint swatch. Below each, three bars for metal, roughness and clearcoat: chrome 255, 2, 16; satin chrome 250, 45, 40; soft matte 0, 200, 165.</desc><rect width="640" height="515" fill="#0b0e17"/><text x="16.0" y="30.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="20" fill="#eef2f9" text-anchor="start" font-weight="700" >Foundation finishes change only the shine</text><text x="16.0" y="52.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#8794ad" text-anchor="start" >Same paint in every column. Only the three spec numbers move.</text><rect x="12.0" y="77.3" width="196.0" height="326.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="12.0" y="85.3" width="4.0" height="310.0" rx="2" fill="#f5761a" /><text x="30.0" y="105.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="17" fill="#eef2f9" text-anchor="start" font-weight="700" >Chrome</text><rect x="30.0" y="135.3" width="160.0" height="80.0" rx="6" fill="#1f3b8f" stroke="#2a3150" stroke-width="1" /><rect x="30.0" y="161.3" width="160.0" height="10.0" rx="0" fill="#e8e8ee" /><rect x="30.0" y="177.3" width="160.0" height="10.0" rx="0" fill="#d62d20" /><text x="110.0" y="235.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13.5" fill="#4cc38a" text-anchor="middle" font-weight="700" >paint: unchanged</text><text x="30.0" y="267.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="start" font-weight="700" >R metal</text><text x="190.0" y="267.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#ff5d6