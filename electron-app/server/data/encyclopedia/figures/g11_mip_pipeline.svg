<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 404" width="640" height="404" role="img" aria-labelledby="t d"><title id="t">TGA, .mip and Trading Paints</title><desc id="d">Three columns. Shokker writes car_num or car TGA for paint and car_spec TGA. iRacing makes car_spec MIP. Trading Paints takes the paint TGA or PNG and only the spec MIP. A warning not to upload the project file.</desc><rect width="640" height="404" fill="#0b0e17"/><text x="16.0" y="30.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="20" fill="#eef2f9" text-anchor="start" font-weight="700" >Who makes which file</text><text x="16.0" y="52.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#8794ad" text-anchor="start" >Shokker writes TGA files. iRacing turns the spec into a .mip. Trading Paints wants</text><text x="16.0" y="71.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#8794ad" text-anchor="start" >the .mip for the spec.</text><rect x="12.0" y="96.6" width="196.0" height="196.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="12.0" y="104.6" width="4.0" height="180.0" rx="2" fill="#f5761a" /><text x="30.0" y="124.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="16" fill="#eef2f9" text-anchor="start" font-weight="700" >Shokker writes</text><text x="30.0" y="152.6" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#f5761a" text-anchor="start" font-weight="700" >car_num_&lt;ID&gt;.tga</text><text x="30.0" y="174.6" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#f5761a" text-anchor="start" font-weight="700" >or car_&lt;ID&gt;.tga</text><text x="30.0" y="196.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="start" >(the paint)</text><text x="30.0" y="224.6" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#f5761a" text-anchor="start" font-weight="700" >car_spec_&lt;ID&gt;.tga</text><text x="30.0" y="246.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="start" >(the shine)</text><line x1="209.0" y1="196.6" x2="221.0" y2="196.6" stroke="#f5761a" stroke-width="3" /><polygon points="221.0,196.6 212.9,200.6 212.9,192.7" fill="#f5761a"/><rect x="222.0" y="96.6" width="196.0" height="196.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="222.0" y="104.6" width="4.0" height="180.0" rx="2" fill="#00e5ff" /><text x="240.0" y="124.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="16" fill="#eef2f9" text-anchor="start" font-weight="700" >iRacing makes</text><text x="240.0" y="152.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#c3ccdd" text-anchor="start" >Loads the paint</text><text x="240.0" y="174.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#c3ccdd" text-anchor="start" >and the spec</text><text x="240.0" y="211.3" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#00e5ff" text-anchor="start" font-weight="700" >car_spec_&lt;ID&gt;.mip</text><text x="240.0" y="233.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="start" >(built next to the spec</text><text x="240.0" y="251.2" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="start" >the first time it loads)</text><line x1="419.0" y1="196.6" x2="431.0" y2="196.6" stroke="#f5761a" stroke-width="3" /><polygon points="431.0,196.6 422.9,200.6 422.9,192.7" fill="#f5761a"/><rect x="432.0" y="96.6" width="196.0" height="196.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="432.0" y="104.6" width="4.0" height="180.0" rx="2" fill="#4cc38a" /><text x="450.0" y="124.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="16" fill="#eef2f9" text-anchor="start" font-weight="700" >Trading Paints takes</text><text x="450.0" y="152.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#c3ccdd" text-anchor="start" >Paint: the .tga or .png</text><text x="450.0" y="198.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#c3ccdd" text-anchor="start" >Spec: only the .mip</text><text x="450.0" y="219.3" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="start" >(drive once in a test</text><text x="450.0" y="237.2" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="13" fill="#8794ad" text-anchor="start" >session first)</text><rect x="14.0" y="308.6" width="612.0" height="78.0" rx="10" fill="#111524" stroke="#2a3150" stroke-width="1.2" /><rect x="14.0" y="316.6" width="4.0" height="62.0" rx="2" fill="#ff2e63" /><text x="32.0" y="336.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="15" fill="#eef2f9" text-anchor="start" font-weight="700" >Never upload the project file</text><text x="32.0" y="358.6" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#c3ccdd" text-anchor="start" >The .spb or .shokk file is your Shokker project. Only Shokker can open it. Ctrl+R</text><text x="32.0" y="378.0" font-family="'Segoe UI', Inter, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#c3ccdd" text-anchor="start" >in iRacing rebuilds the .mip after a new render.</text></svg>
